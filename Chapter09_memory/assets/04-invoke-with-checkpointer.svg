<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" role="img" aria-labelledby="title desc">
  <title id="title">第二次 invoke 时，checkpointer 做了什么</title>
  <desc id="desc">第二次调用只传入一条新消息。① 读取：按 thread_id 找到最新检查点，恢复出含 2 条消息的 state。② 合并：新消息按 add_messages 规则追加，变成 3 条。③ 执行：model 节点用 3 条消息调用模型，回复追加后变成 4 条。④ 保存：收到输入时、合并后、模型回复后各存一个检查点，本轮新增 step 2、3、4 三个检查点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a1b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:16px;fill:#52677e;font-family:"SFMono-Regular",Menlo,Consolas,"PingFang SC",monospace}
      .label{font-size:19px;font-weight:650}
      .step{font-size:20px;font-weight:700;fill:#1d5fa8}
      .body{font-size:17px}
      .small{font-size:15px;fill:#52677e}
      .code{font-family:"SFMono-Regular",Menlo,Consolas,"PingFang SC",monospace;font-size:15px}
      .new{fill:#127a4b;font-weight:700}
      .ck{font-size:16px;font-weight:650}
      .tag-latest{font-size:14px;font-weight:700;fill:#9a5b00}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-mem{fill:none;stroke:#c98a1b;stroke-width:2.2;marker-end:url(#arrow-mem)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .chip{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .chip-plain{fill:#f4f6f9;stroke:#d5dde7;stroke-width:1.5}
      .card{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.4}
      .card-new{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1160" height="790" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">第二次 invoke 时，checkpointer 做了什么</text>
  <text x="36" y="82" class="sub">agent.invoke({"messages": [HumanMessage("我叫什么？")]}, config)   # thread_id = "1"</text>

  <!-- 左：Agent 内部 -->
  <rect x="32" y="108" width="708" height="590" rx="16" class="panel"/>
  <text x="52" y="142" class="label">Agent 内部（一次 invoke）</text>

  <text x="60" y="186" class="step">① 读取</text>
  <text x="60" y="211" class="small">用 thread_id 找到这个会话最新的检查点，恢复出 state</text>
  <rect x="60" y="224" width="660" height="42" rx="9" class="chip"/>
  <text x="76" y="251" class="code">messages = [Human「我叫张三」, AI「你好，张三。」]</text>
  <path d="M 390 270 V 290" class="arrow"/>

  <text x="60" y="318" class="step">② 合并</text>
  <text x="60" y="343" class="small">本次传入的新消息按 add_messages 规则追加到 messages 末尾</text>
  <rect x="60" y="356" width="660" height="42" rx="9" class="chip"/>
  <text x="76" y="383" class="code">messages = [Human「我叫张三」, AI「你好，张三。」, <tspan class="new">Human「我叫什么？」</tspan>]</text>
  <path d="M 390 402 V 422" class="arrow"/>

  <text x="60" y="450" class="step">③ 执行</text>
  <text x="60" y="475" class="small">model 节点把这 3 条消息发给大模型，模型的回复也追加进 messages</text>
  <rect x="60" y="488" width="660" height="42" rx="9" class="chip"/>
  <text x="76" y="515" class="code">messages = [前 3 条……, <tspan class="new">AI「你叫张三。」</tspan>]</text>

  <text x="60" y="582" class="step">④ 保存（贯穿全程）</text>
  <text x="60" y="607" class="small">每执行完一步，就把当时的 state 存成一个新检查点</text>
  <rect x="60" y="620" width="660" height="42" rx="9" class="chip-plain"/>
  <text x="76" y="647" class="body">收到输入时、② 之后、③ 之后，各存一个检查点</text>

  <!-- 右：InMemorySaver -->
  <rect x="780" y="108" width="348" height="590" rx="16" class="panel"/>
  <text x="800" y="142" class="label">InMemorySaver</text>
  <text x="800" y="166" class="small">thread_id = "1" 的检查点</text>

  <text x="800" y="198" class="small">第 1 轮留下的</text>
  <rect x="800" y="208" width="308" height="52" rx="9" class="card"/>
  <text x="816" y="230" class="ck">step -1 · 收到输入</text>
  <text x="816" y="251" class="small">messages 0 条</text>
  <rect x="800" y="268" width="308" height="52" rx="9" class="card"/>
  <text x="816" y="290" class="ck">step 0 · 合并新消息后</text>
  <text x="816" y="311" class="small">messages 1 条</text>
  <rect x="800" y="328" width="308" height="52" rx="9" class="card"/>
  <text x="816" y="350" class="ck">step 1 · 模型回复后</text>
  <text x="816" y="371" class="small">messages 2 条</text>
  <text x="1094" y="350" class="tag-latest" text-anchor="end">调用前最新</text>

  <text x="800" y="430" class="small">本轮新增的</text>
  <rect x="800" y="440" width="308" height="52" rx="9" class="card-new"/>
  <text x="816" y="462" class="ck">step 2 · 收到输入</text>
  <text x="816" y="483" class="small">messages 2 条（新消息还没合并）</text>
  <rect x="800" y="500" width="308" height="52" rx="9" class="card-new"/>
  <text x="816" y="522" class="ck">step 3 · 合并新消息后</text>
  <text x="816" y="543" class="small">messages 3 条</text>
  <rect x="800" y="560" width="308" height="52" rx="9" class="card-new"/>
  <text x="816" y="582" class="ck">step 4 · 模型回复后</text>
  <text x="816" y="603" class="small">messages 4 条</text>
  <text x="1094" y="582" class="tag-latest" text-anchor="end">调用后最新</text>
  <text x="800" y="648" class="small">每个检查点都记着上一个检查点的 id，</text>
  <text x="800" y="672" class="small">连成一条链</text>

  <path d="M 798 354 C 760 354, 762 245, 728 245" class="arrow-mem"/>
  <path d="M 724 641 C 762 641, 762 526, 794 526" class="arrow-mem"/>

  <text x="36" y="740" class="body">返回的 response2["messages"] 有 4 条：你只传了 1 条新消息，前 2 条是从检查点恢复的，最后 1 条是模型的回复。</text>
</svg>
