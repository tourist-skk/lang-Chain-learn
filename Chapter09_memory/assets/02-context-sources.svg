<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="830" viewBox="0 0 1160 830" role="img" aria-labelledby="title desc">
  <title id="title">一次模型调用的上下文从哪里来</title>
  <desc id="desc">左侧是三类上下文和本轮输入：静态运行时上下文提供 user_id，用来决定读写 Store 的哪个命名空间；Store 中的用户资料经选取后放进系统提示词；State 中的历史消息经压缩后放进历史消息；本轮输入追加为新问题。中间是发给模型的一次请求，右侧是大模型。模型回复和工具结果写回 State，由 checkpointer 自动保存；需要长期保存的信息由工具或中间件写入 Store。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .body{font-size:17px}
      .small{font-size:15px;fill:#52677e}
      .code{font-family:"SFMono-Regular",Menlo,Consolas,"PingFang SC",monospace;font-size:15px}
      .tag-ctx{font-size:15px;fill:#52677e;font-weight:600}
      .tag-long{font-size:15px;fill:#9a5b00;font-weight:600}
      .tag-short{font-size:15px;fill:#1d5fa8;font-weight:600}
      .op{font-size:17px;font-weight:700;fill:#6a4fc4}
      .op-sub{font-size:14px;fill:#6a4fc4}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-op{fill:none;stroke:#8c78d6;stroke-width:2;marker-end:url(#arrow)}
      .ctx{fill:#eef2f7;stroke:#c8d3e0;stroke-width:1.5}
      .long{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.5}
      .short{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .plain{fill:#ffffff;stroke:#d5dde7;stroke-width:1.5}
      .window{fill:#ffffff;stroke:#9fb3c8;stroke-width:1.8;stroke-dasharray:7 5}
      .model{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1160" height="830" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">一次模型调用的上下文从哪里来</text>
  <text x="36" y="82" class="sub">左边是三类上下文（数据源），中间是上下文工程：从中选什么、以什么形式放进这一次请求</text>

  <!-- 左侧：数据源 -->
  <rect x="32" y="110" width="400" height="100" rx="12" class="ctx"/>
  <text x="52" y="140" class="label">静态运行时上下文 Runtime Context</text>
  <text x="52" y="166" class="tag-ctx">静态 · 一次运行 · 不算记忆</text>
  <text x="52" y="194" class="code">context={"user_id": "u_001"}</text>

  <path d="M 232 210 V 242" class="arrow"/>
  <text x="246" y="232" class="small">user_id 决定读写哪个 namespace</text>

  <rect x="32" y="250" width="400" height="130" rx="12" class="long"/>
  <text x="52" y="280" class="label">跨会话上下文 Store</text>
  <text x="52" y="306" class="tag-long">动态 · 跨会话 · 长期记忆</text>
  <text x="52" y="336" class="code">("users", "u_001") / "profile"</text>
  <text x="52" y="362" class="code">{"name": "小明", "style": "简洁"}</text>

  <rect x="32" y="420" width="400" height="130" rx="12" class="short"/>
  <text x="52" y="450" class="label">动态运行时上下文 State</text>
  <text x="52" y="476" class="tag-short">动态 · 一次运行 · 短期记忆</text>
  <text x="52" y="506" class="code">messages=[Human, AI, Human, …]</text>
  <text x="52" y="532" class="small">checkpointer 按 thread_id 保存，下次接着用</text>

  <rect x="32" y="590" width="400" height="60" rx="12" class="plain"/>
  <text x="52" y="615" class="label">本轮输入</text>
  <text x="52" y="639" class="code">invoke({"messages": [新问题]})</text>

  <!-- 中间：上下文工程 -->
  <text x="516" y="400" class="op" text-anchor="middle">上下文工程</text>
  <text x="516" y="424" class="op-sub" text-anchor="middle">放什么、怎么放</text>
  <path d="M 444 315 H 588" class="arrow-op"/>
  <text x="516" y="303" class="op" text-anchor="middle">选取</text>
  <text x="516" y="336" class="op-sub" text-anchor="middle">get / search</text>
  <path d="M 444 485 H 588" class="arrow-op"/>
  <text x="516" y="473" class="op" text-anchor="middle">压缩</text>
  <text x="516" y="506" class="op-sub" text-anchor="middle">裁剪 / 删除 / 摘要</text>
  <path d="M 444 620 H 588" class="arrow-op"/>
  <text x="516" y="608" class="op" text-anchor="middle">追加</text>

  <!-- 一次请求 -->
  <rect x="600" y="230" width="300" height="440" rx="14" class="window"/>
  <text x="616" y="262" class="label">发给模型的一次请求</text>
  <rect x="616" y="280" width="268" height="70" rx="10" class="long"/>
  <text x="632" y="308" class="label">系统提示词</text>
  <text x="632" y="334" class="small">＋ 从 Store 取出的用户资料</text>
  <rect x="616" y="370" width="268" height="60" rx="10" class="plain"/>
  <text x="632" y="396" class="label">工具说明</text>
  <text x="632" y="419" class="small">每个工具的名称、参数</text>
  <rect x="616" y="450" width="268" height="70" rx="10" class="short"/>
  <text x="632" y="478" class="label">历史消息</text>
  <text x="632" y="504" class="small">来自 State，太长时先压缩</text>
  <rect x="616" y="590" width="268" height="60" rx="10" class="plain"/>
  <text x="632" y="626" class="label">本轮新问题</text>

  <path d="M 912 450 H 948" class="arrow"/>
  <rect x="960" y="410" width="168" height="80" rx="12" class="model"/>
  <text x="1044" y="457" class="label" text-anchor="middle">大模型</text>

  <!-- 写回 -->
  <path d="M 1044 490 V 692" class="arrow"/>
  <rect x="32" y="704" width="1096" height="96" rx="14" fill="#ffffff" stroke="#dce4ee"/>
  <text x="52" y="734" class="label">写回</text>
  <text x="110" y="734" class="body">模型回复、工具结果 → 追加到 State 的 messages，checkpointer 在每一步之后自动保存</text>
  <text x="110" y="766" class="body">值得长期保存的信息 → 在工具或中间件里调用 store.put 写入 Store（需要自己实现）</text>
  <text x="110" y="790" class="small">Runtime Context 不会被写回：它在调用时传入，运行过程中不变</text>
</svg>
