<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" role="img" aria-labelledby="title desc">
  <title id="title">InMemorySaver 内部：三个字典</title>
  <desc id="desc">storage 按 thread_id、checkpoint_ns、checkpoint_id 三层保存检查点主体、元数据和父检查点 id，检查点主体里只记录各通道的版本号。blobs 以 thread_id、checkpoint_ns、通道名、版本号为键保存 state 各字段的值，messages 通道的每个版本都是完整的消息列表，版本 2、3、5、6、8、9 分别有 1 到 6 条消息。读取时按检查点里的版本号到 blobs 取值。writes 保存从某个检查点出发执行下一步时各节点写出的更新。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a1b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .dict{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:22px;font-weight:700;fill:#1d5fa8}
      .label{font-size:18px;font-weight:650}
      .body{font-size:16px}
      .small{font-size:14px;fill:#52677e}
      .code{font-family:"SFMono-Regular",Menlo,Consolas,"PingFang SC",monospace;font-size:14px}
      .code-key{font-family:"SFMono-Regular",Menlo,Consolas,"PingFang SC",monospace;font-size:14px;fill:#1d5fa8}
      .hl{fill:#9a5b00;font-weight:700}
      .note{font-size:14px;fill:#9a5b00;font-weight:600}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-mem{fill:none;stroke:#c98a1b;stroke-width:2.2;marker-end:url(#arrow-mem)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .box{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.4}
      .box-meta{fill:#f4f6f9;stroke:#d5dde7;stroke-width:1.4}
      .box-mem{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.4}
      .bar{fill:#f2c879}
      .bar-latest{fill:#d99a2b}
    </style>
  </defs>
  <rect width="1160" height="900" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">InMemorySaver 内部：三个字典</text>
  <text x="36" y="82" class="sub">以笔记中 thread_id = "1" 聊完三轮后的数据为例 · 所有键都以 thread_id 开头，所以不同会话互不干扰</text>

  <!-- storage -->
  <rect x="32" y="108" width="1096" height="248" rx="16" class="panel"/>
  <text x="52" y="146" class="dict">storage</text>
  <text x="52" y="172" class="small">检查点主体，共 9 个（这里只画最新的一个）</text>
  <text x="52" y="214" class="code-key">storage["1"][""]["…df6d"]</text>
  <text x="52" y="240" class="small">thread_id → checkpoint_ns → checkpoint_id</text>
  <text x="52" y="264" class="small">checkpoint_ns 是给子图用的，Agent 中为 ""</text>
  <text x="52" y="300" class="small">值是一个三元组 →</text>

  <rect x="380" y="128" width="380" height="210" rx="10" class="box"/>
  <text x="396" y="154" class="label">① 检查点主体（不含 state 的值）</text>
  <text x="396" y="180" class="code">id: "1f1c…df6d"</text>
  <text x="396" y="203" class="code">ts: "2026-10-07T15:46…"</text>
  <text x="396" y="226" class="code">channel_versions:  # 各通道当前版本</text>
  <text x="396" y="249" class="code">  <tspan class="hl">"messages": 9</tspan>, "__start__": 8, …</text>
  <text x="396" y="272" class="code">versions_seen:  # 各节点看过的版本</text>
  <text x="396" y="295" class="code">updated_channels: ["messages"]</text>
  <text x="396" y="324" class="small">state 的值不放在这里，只记版本号</text>

  <rect x="776" y="128" width="170" height="210" rx="10" class="box-meta"/>
  <text x="792" y="154" class="label">② 元数据</text>
  <text x="792" y="182" class="code">source: "loop"</text>
  <text x="792" y="208" class="code">step: 7</text>
  <text x="792" y="244" class="small">get_state 返回的</text>
  <text x="792" y="266" class="small">metadata 就是它</text>

  <rect x="962" y="128" width="146" height="210" rx="10" class="box-meta"/>
  <text x="978" y="154" class="label">③ 父检查点</text>
  <text x="978" y="182" class="code">"1f1c…1ff0"</text>
  <text x="978" y="208" class="small">即 step 6</text>
  <text x="978" y="244" class="small">靠它连成</text>
  <text x="978" y="266" class="small">一条链</text>

  <!-- blobs -->
  <rect x="32" y="376" width="1096" height="262" rx="16" class="panel"/>
  <text x="52" y="414" class="dict">blobs</text>
  <text x="52" y="440" class="small">state 各字段的值，按版本存</text>
  <text x="52" y="482" class="code-key">blobs[("1", "", "messages", 9)]</text>
  <text x="52" y="508" class="small">thread_id, checkpoint_ns, 通道名, 版本号</text>
  <text x="52" y="566" class="note">读取时：拿检查点主体里的版本号</text>
  <text x="52" y="590" class="note">到这里取值，拼回 state</text>

  <text x="400" y="414" class="label">messages 通道的各个版本：每个版本都是完整的消息列表</text>
  <text x="400" y="452" class="code">版本 2</text>
  <rect x="470" y="438" width="60" height="18" rx="4" class="bar"/>
  <text x="542" y="452" class="small">1 条 · 第 1 轮合并后</text>
  <text x="400" y="480" class="code">版本 3</text>
  <rect x="470" y="466" width="120" height="18" rx="4" class="bar"/>
  <text x="602" y="480" class="small">2 条 · 第 1 轮模型回复后</text>
  <text x="400" y="508" class="code">版本 5</text>
  <rect x="470" y="494" width="180" height="18" rx="4" class="bar"/>
  <text x="662" y="508" class="small">3 条 · 第 2 轮合并后</text>
  <text x="400" y="536" class="code">版本 6</text>
  <rect x="470" y="522" width="240" height="18" rx="4" class="bar"/>
  <text x="722" y="536" class="small">4 条 · 第 2 轮模型回复后</text>
  <text x="400" y="564" class="code">版本 8</text>
  <rect x="470" y="550" width="300" height="18" rx="4" class="bar"/>
  <text x="782" y="564" class="small">5 条 · 第 3 轮合并后</text>
  <text x="400" y="592" class="code hl">版本 9</text>
  <rect x="470" y="578" width="360" height="18" rx="4" class="bar-latest"/>
  <text x="842" y="592" class="note">6 条 · 最新检查点用的就是它</text>
  <text x="400" y="622" class="small">6 条消息一共存了 1+2+3+4+5+6 = 21 份副本：对话越长，占用的内存增长越快</text>

  <path d="M 380 245 H 358 V 586 H 388" class="arrow-mem"/>

  <!-- writes -->
  <rect x="32" y="658" width="1096" height="168" rx="16" class="panel"/>
  <text x="52" y="696" class="dict">writes</text>
  <text x="52" y="722" class="small">每一步中各节点写出的更新</text>
  <text x="52" y="764" class="code-key">writes[("1", "", "…step 6 的 id")]</text>
  <text x="52" y="790" class="small">thread_id, checkpoint_ns, checkpoint_id</text>

  <rect x="400" y="678" width="708" height="130" rx="10" class="box-meta"/>
  <text x="416" y="706" class="label">从 step 6 出发执行下一步时，各节点写出的内容</text>
  <text x="416" y="736" class="code">("model" 节点的任务 id, "messages", [AI「你刚才问的是……」])</text>
  <text x="416" y="768" class="body">用途：这一步中途出错时，已经完成的节点结果不会丢，恢复时不用重跑。</text>
  <text x="416" y="794" class="small">step 6 + 这些更新 = step 7，所以最新检查点自己的 writes 是空的</text>

  <text x="36" y="862" class="body">读取（get_tuple）：取 checkpoint_id 最大的检查点 → 按版本号到 blobs 取值 → 拼成 state。写入（put）：只为本步更新过的通道存新版本。</text>
</svg>
