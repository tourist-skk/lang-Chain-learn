<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="880" viewBox="0 0 1160 880" role="img" aria-labelledby="title desc">
  <title id="title">模型为什么会“忘记”：记忆是在模型之外保存历史</title>
  <desc id="desc">A 部分：没有记忆时，每次 invoke 只发送本轮消息，第二次问名字时模型不知道。B 部分：有记忆时，程序在第一次调用后保存问答，第二次调用时把历史取出、拼在新问题前面一起发送，模型就能答出名字。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a1b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .body{font-size:18px}
      .small{font-size:15px;fill:#52677e}
      .from-mem{font-size:18px;fill:#9a5b00}
      .mem-note{font-size:15px;fill:#9a5b00;font-weight:600}
      .bad-text{font-size:18px;fill:#b42318}
      .good-text{font-size:18px;fill:#127a4b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-mem{fill:none;stroke:#c98a1b;stroke-width:2.2;marker-end:url(#arrow-mem)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .req{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .model{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .resp{fill:#f4f6f9;stroke:#d5dde7;stroke-width:1.5}
      .bad{fill:#fdeeee;stroke:#f0b8b8;stroke-width:1.5}
      .good{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .mem{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1160" height="880" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">模型为什么会“忘记”：记忆是在模型之外保存历史</text>
  <text x="36" y="82" class="sub">同一个 agent 先后调用两次 invoke · 模型只能看到本次请求里发给它的消息</text>

  <!-- A：没有记忆 -->
  <rect x="32" y="108" width="1096" height="262" rx="16" class="panel"/>
  <text x="52" y="140" class="label">A · 没有记忆：每次 invoke 只发送本轮的消息</text>

  <text x="52" y="200" class="label">第 1 次</text>
  <rect x="150" y="160" width="410" height="66" rx="10" class="req"/>
  <text x="170" y="186" class="small">发送 1 条消息</text>
  <text x="170" y="212" class="body">Human「你好，我叫小明」</text>
  <path d="M 572 193 H 628" class="arrow"/>
  <rect x="640" y="160" width="140" height="66" rx="10" class="model"/>
  <text x="710" y="200" class="label" text-anchor="middle">大模型</text>
  <path d="M 792 193 H 848" class="arrow"/>
  <rect x="860" y="160" width="248" height="66" rx="10" class="resp"/>
  <text x="880" y="186" class="small">回复</text>
  <text x="880" y="212" class="body">AI「很高兴认识你，小明」</text>

  <text x="150" y="253" class="small">✕ 两次调用之间，agent 和模型都没有保存任何内容</text>

  <text x="52" y="310" class="label">第 2 次</text>
  <rect x="150" y="270" width="410" height="66" rx="10" class="req"/>
  <text x="170" y="296" class="small">发送 1 条消息</text>
  <text x="170" y="322" class="body">Human「我叫什么名字？」</text>
  <path d="M 572 303 H 628" class="arrow"/>
  <rect x="640" y="270" width="140" height="66" rx="10" class="model"/>
  <text x="710" y="310" class="label" text-anchor="middle">大模型</text>
  <path d="M 792 303 H 848" class="arrow"/>
  <rect x="860" y="270" width="248" height="66" rx="10" class="bad"/>
  <text x="880" y="296" class="small">回复</text>
  <text x="880" y="322" class="bad-text">AI「我还不知道你的名字」</text>

  <!-- B：有记忆 -->
  <rect x="32" y="398" width="1096" height="410" rx="16" class="panel"/>
  <text x="52" y="430" class="label">B · 有记忆：程序把历史保存下来，下次请求时一起发送</text>

  <text x="52" y="490" class="label">第 1 次</text>
  <rect x="150" y="450" width="410" height="66" rx="10" class="req"/>
  <text x="170" y="476" class="small">发送 1 条消息</text>
  <text x="170" y="502" class="body">Human「你好，我叫小明」</text>
  <path d="M 572 483 H 628" class="arrow"/>
  <rect x="640" y="450" width="140" height="66" rx="10" class="model"/>
  <text x="710" y="490" class="label" text-anchor="middle">大模型</text>
  <path d="M 792 483 H 848" class="arrow"/>
  <rect x="860" y="450" width="248" height="66" rx="10" class="resp"/>
  <text x="880" y="476" class="small">回复</text>
  <text x="880" y="502" class="body">AI「很高兴认识你，小明」</text>

  <rect x="400" y="556" width="480" height="74" rx="10" class="mem"/>
  <text x="420" y="584" class="label">记忆存储</text>
  <text x="420" y="612" class="from-mem">你好，我叫小明 ／ 很高兴认识你，小明</text>
  <path d="M 984 516 V 593 H 892" class="arrow-mem"/>
  <text x="996" y="560" class="mem-note">① 保存本轮问答</text>
  <path d="M 400 593 H 355 V 648" class="arrow-mem"/>
  <text x="343" y="628" class="mem-note" text-anchor="end">② 取出历史</text>

  <text x="52" y="724" class="label">第 2 次</text>
  <rect x="150" y="660" width="410" height="120" rx="10" class="req"/>
  <text x="170" y="686" class="small">发送 3 条消息</text>
  <text x="170" y="713" class="from-mem">Human「你好，我叫小明」</text>
  <text x="170" y="740" class="from-mem">AI「很高兴认识你，小明」</text>
  <text x="545" y="727" class="mem-note" text-anchor="end">取自记忆</text>
  <text x="170" y="767" class="body">Human「我叫什么名字？」</text>
  <path d="M 572 720 H 628" class="arrow"/>
  <rect x="640" y="687" width="140" height="66" rx="10" class="model"/>
  <text x="710" y="727" class="label" text-anchor="middle">大模型</text>
  <path d="M 792 720 H 848" class="arrow"/>
  <rect x="860" y="687" width="248" height="66" rx="10" class="good"/>
  <text x="880" y="713" class="small">回复</text>
  <text x="880" y="739" class="good-text">AI「你叫小明」</text>

  <text x="36" y="846" class="body">LangChain 的记忆组件替你完成 ① 保存 和 ② 取出：短期记忆靠 checkpointer，长期记忆靠 store。</text>
</svg>
