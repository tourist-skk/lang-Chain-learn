<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">一个 Skill 分三层进入模型上下文</title><desc id="desc">技能目录 plan-consultation 中，SKILL.md 的 YAML 元数据（name 和 description）是第一层，创建 Agent 时放进系统提示，每次请求都在；SKILL.md 的 Markdown 正文是第二层，任务相关时由 load_skill 读取；references/plan-guide.md 是第三层，正文要求且确实需要时由 read_skill_file 读取。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.head{font-size:19px;font-weight:650;fill:#52677e}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="620" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">一个 Skill，分三层进入上下文</text>
<text x="36" y="83" class="small" text-anchor="start">规范称为渐进式披露：先给摘要，任务需要时再给正文和资料。</text>
<rect x="40" y="110" width="440" height="480" rx="16" class="panel"/>
<text x="60" y="142" class="code" text-anchor="start">skills/plan-consultation/</text>
<rect x="60" y="158" width="400" height="282" rx="12" fill="#f8fafc" stroke="#dce4ee" stroke-width="1.5"/>
<text x="78" y="184" class="label" text-anchor="start">SKILL.md</text>
<rect x="75" y="195" width="370" height="105" rx="10" class="blue"/>
<text x="92" y="225" class="code" text-anchor="start">name: plan-consultation</text>
<text x="92" y="253" class="code" text-anchor="start">description: 何时使用……</text>
<text x="92" y="283" class="small" text-anchor="start">开头的 YAML 元数据</text>
<rect x="75" y="312" width="370" height="115" rx="10" class="green"/>
<text x="92" y="343" class="body" text-anchor="start"># 套餐咨询</text>
<text x="92" y="375" class="body" text-anchor="start">执行步骤 1–4、输出要求</text>
<text x="92" y="407" class="small" text-anchor="start">之后的 Markdown 正文</text>
<rect x="60" y="455" width="400" height="115" rx="12" class="amber"/>
<text x="78" y="490" class="code" text-anchor="start">references/plan-guide.md</text>
<text x="78" y="523" class="body" text-anchor="start">套餐价格、人数上限与额度</text>
<text x="78" y="555" class="small" text-anchor="start">正文中用相对路径引用的辅助资料</text>
<rect x="560" y="195" width="560" height="105" rx="14" class="blue"/>
<text x="580" y="230" class="label" text-anchor="start">第 1 层：元数据</text>
<text x="580" y="263" class="body" text-anchor="start">创建 Agent 时放进系统提示，每次请求都在</text>
<text x="580" y="290" class="small" text-anchor="start">所有技能都放；规范估算每个约 100 token</text>
<rect x="560" y="312" width="560" height="115" rx="14" class="green"/>
<text x="580" y="347" class="label" text-anchor="start">第 2 层：正文</text>
<text x="580" y="380" class="body" text-anchor="start">任务相关时，模型调用 load_skill 读取</text>
<text x="580" y="410" class="small" text-anchor="start">作为 ToolMessage 进入；规范建议少于 5000 token</text>
<rect x="560" y="455" width="560" height="115" rx="14" class="amber"/>
<text x="580" y="490" class="label" text-anchor="start">第 3 层：辅助资料</text>
<text x="580" y="523" class="body" text-anchor="start">正文要求且确实需要时，调用 read_skill_file</text>
<text x="580" y="553" class="small" text-anchor="start">没用到的资料不会进入上下文</text>
<path d="M 449 247 H 556" class="arrow"/>
<path d="M 449 369 H 556" class="arrow"/>
<path d="M 464 512 H 556" class="arrow"/>
</svg>
