<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
<title id="title">退款审核的执行顺序与人工审核的两条路径</title><desc id="desc">Agent 依次加载退款审核技能、查询订单、检索两次退款规则、查询套餐额度并计算使用比例、读取工单模板，然后请求创建工单。人工审核中间件在工单工具执行前暂停，第一次 ainvoke 返回 __interrupt__。第二次 ainvoke 用 Command(resume=...) 和同一个 thread_id 继续：批准时执行工具并创建工单；拒绝时不执行工具，返回 status 为 error 的 ToolMessage，模型说明工单未创建。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:16px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#36506b}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.red{fill:#fdeeee;stroke:#e3a3a3;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="680" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">写入工单前暂停，由人决定</text>
<text x="36" y="83" class="small" text-anchor="start">左侧是一次审核中模型请求的顺序（示意，实际顺序与是否并行以运行输出为准）。</text>
<rect x="40" y="115" width="560" height="62" rx="10" class="green"/>
<text x="60" y="142" class="body" text-anchor="start">① 加载退款审核技能</text>
<text x="60" y="166" class="code" text-anchor="start">load_skill("refund-review") → 审核步骤</text>
<rect x="40" y="189" width="560" height="62" rx="10" class="amber"/>
<text x="60" y="216" class="body" text-anchor="start">② 查询订单</text>
<text x="60" y="240" class="code" text-anchor="start">service_get_mock_order → 套餐、天数、用量、发票</text>
<rect x="40" y="263" width="560" height="62" rx="10" class="amber"/>
<text x="60" y="290" class="body" text-anchor="start">③ 检索退款规则（两次）</text>
<text x="60" y="314" class="code" text-anchor="start">service_search_knowledge → 带编号的规则片段</text>
<rect x="40" y="337" width="560" height="62" rx="10" class="amber"/>
<text x="60" y="364" class="body" text-anchor="start">④ 计算 AI 问答使用比例</text>
<text x="60" y="388" class="code" text-anchor="start">plans_get_plan + calc_divide → 例如 0.07</text>
<rect x="40" y="411" width="560" height="62" rx="10" class="green"/>
<text x="60" y="438" class="body" text-anchor="start">⑤ 读取工单模板</text>
<text x="60" y="462" class="code" text-anchor="start">read_skill_file("assets/ticket-template.md")</text>
<rect x="40" y="485" width="560" height="62" rx="10" class="red"/>
<text x="60" y="512" class="body" text-anchor="start">⑥ 请求创建工单 → 人工审核暂停</text>
<text x="60" y="536" class="code" text-anchor="start">service_create_mock_ticket 还没有执行</text>
<rect x="660" y="115" width="460" height="230" rx="14" class="blue"/>
<text x="680" y="150" class="label" text-anchor="start">两次 ainvoke</text>
<text x="680" y="188" class="body" text-anchor="start">第一次：运行到 ⑥ 暂停</text>
<text x="680" y="214" class="small" text-anchor="start">返回值多一个 __interrupt__，带着待审批的参数</text>
<text x="680" y="256" class="body" text-anchor="start">第二次：Command(resume=决策)</text>
<text x="680" y="282" class="small" text-anchor="start">同一个 thread_id，checkpointer 读出暂停时的</text>
<text x="680" y="306" class="small" text-anchor="start">状态，从暂停处继续</text>
<rect x="660" y="385" width="460" height="105" rx="14" class="green"/>
<text x="680" y="418" class="label" text-anchor="start">批准 approve</text>
<text x="680" y="450" class="body" text-anchor="start">执行工具，服务创建工单</text>
<text x="680" y="476" class="small" text-anchor="start">模型回答中给出工单号</text>
<rect x="660" y="530" width="460" height="105" rx="14" class="red"/>
<text x="680" y="563" class="label" text-anchor="start">拒绝 reject</text>
<text x="680" y="595" class="body" text-anchor="start">不执行工具，ToolMessage 状态为 error</text>
<text x="680" y="621" class="small" text-anchor="start">模型说明工单没有创建</text>
<path d="M 604 516 C 630 516, 630 437, 656 437" class="arrow"/>
<path d="M 604 516 C 630 516, 630 582, 656 582" class="arrow"/>
<rect x="40" y="580" width="22" height="22" rx="5" class="green"/>
<text x="72" y="598" class="small" text-anchor="start">技能加载工具</text>
<rect x="200" y="580" width="22" height="22" rx="5" class="amber"/>
<text x="232" y="598" class="small" text-anchor="start">MCP 工具</text>
<rect x="340" y="580" width="22" height="22" rx="5" class="red"/>
<text x="372" y="598" class="small" text-anchor="start">人工审核</text>
</svg>
