<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
<title id="title">综合实战的整体结构</title><desc id="desc">Agent 由 create_agent 创建，系统提示包含身份与技能摘要，工具包括 MCP 工具和技能加载工具，中间件是人工审核，checkpointer 保存暂停状态。左侧 skills 目录中有套餐咨询和退款审核两个技能，通过 load_skill 与 read_skill_file 加载。右侧 MCPAdapter 用配置字典接入三个服务：calc 和 plans 通过 stdio，service 通过 HTTP，service 提供知识检索、订单查询和工单创建，并通过 Resource tickets://all 让应用代码核对工单。人工审核在 create_mock_ticket 执行前暂停。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:17px} .small{font-size:16px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.red{fill:#fdeeee;stroke:#e3a3a3;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="680" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">技能、MCP 服务和人工审核组合在一个 Agent 里</text>
<text x="36" y="83" class="small" text-anchor="start">技能说明怎样审核，MCP 服务执行操作，中间件在写入前暂停。括号中是对应的章节。</text>
<rect x="40" y="125" width="320" height="260" rx="14" class="green"/>
<text x="60" y="160" class="code" text-anchor="start">skills/</text>
<text x="60" y="187" class="small" text-anchor="start">加载器：skill_loader.py（第十二章 01）</text>
<rect x="60" y="205" width="280" height="70" rx="10" class="panel"/>
<text x="78" y="235" class="code" text-anchor="start">plan-consultation</text>
<text x="78" y="261" class="small" text-anchor="start">套餐咨询（第十二章 01）</text>
<rect x="60" y="290" width="280" height="75" rx="10" class="panel"/>
<text x="78" y="320" class="code" text-anchor="start">refund-review</text>
<text x="78" y="347" class="small" text-anchor="start">退款审核（本节新增）</text>
<rect x="400" y="125" width="360" height="260" rx="14" class="purple"/>
<text x="420" y="162" class="label" text-anchor="start">Agent（create_agent）</text>
<text x="420" y="203" class="body" text-anchor="start">系统提示：身份 + 技能摘要</text>
<text x="420" y="238" class="body" text-anchor="start">工具：MCP 工具 + 技能加载工具</text>
<text x="420" y="273" class="body" text-anchor="start">中间件：人工审核</text>
<text x="420" y="308" class="body" text-anchor="start">checkpointer：保存暂停状态</text>
<text x="420" y="350" class="small" text-anchor="start">写法与第七章相同</text>
<rect x="400" y="410" width="360" height="120" rx="14" class="red"/>
<text x="420" y="446" class="label" text-anchor="start">人工审核（第八章）</text>
<text x="420" y="480" class="body" text-anchor="start">create_mock_ticket 执行前暂停</text>
<text x="420" y="510" class="small" text-anchor="start">approve 才执行；reject 不创建工单</text>
<rect x="800" y="125" width="320" height="505" rx="14" class="blue"/>
<text x="820" y="160" class="label" text-anchor="start">MCPAdapter + 配置字典</text>
<text x="820" y="186" class="small" text-anchor="start">第十一章 06</text>
<rect x="820" y="200" width="280" height="75" rx="10" class="amber"/>
<text x="838" y="228" class="body" text-anchor="start">calc（stdio）</text>
<text x="838" y="256" class="code" text-anchor="start">add · divide</text>
<rect x="820" y="290" width="280" height="75" rx="10" class="amber"/>
<text x="838" y="318" class="body" text-anchor="start">plans（stdio）</text>
<text x="838" y="346" class="code" text-anchor="start">get_plan</text>
<rect x="820" y="380" width="280" height="235" rx="10" class="amber"/>
<text x="838" y="408" class="body" text-anchor="start">service（HTTP，本节新增）</text>
<text x="838" y="438" class="code" text-anchor="start">search_knowledge</text>
<text x="838" y="463" class="code" text-anchor="start">get_mock_order</text>
<text x="838" y="488" class="code" text-anchor="start">create_mock_ticket</text>
<text x="838" y="522" class="small" text-anchor="start">检索：knowledge.txt（第十章）</text>
<text x="838" y="550" class="small" text-anchor="start">订单：mock-orders.json</text>
<text x="838" y="578" class="small" text-anchor="start">Resource：tickets://all</text>
<text x="838" y="604" class="small" text-anchor="start">工单只保存在服务内存中</text>
<rect x="40" y="550" width="720" height="80" rx="14" class="panel"/>
<text x="60" y="582" class="label" text-anchor="start">应用代码：读取 tickets://all 核对工单</text>
<text x="60" y="612" class="small" text-anchor="start">Resource 由应用决定使用，不在 Agent 的工具列表中（第十一章 05）</text>
<path d="M 364 255 H 396" class="arrow"/>
<path d="M 764 255 H 796" class="arrow"/>
<path d="M 580 389 V 406" class="arrow"/>
<path d="M 764 590 H 816" class="arrow"/>
</svg>
