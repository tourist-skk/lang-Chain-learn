<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">RecursiveCharacterTextSplitter 的递归切分流程</title>
  <desc id="desc">_split_text(text, separators) 的流程：第一步按顺序找第一个在文本中出现的分隔符，排到空字符串时逐字符切，剩余分隔符是它后面的部分。第二步用它把文本切成片段，keep_separator 默认把分隔符留在下一个片段开头。第三步依次处理每个片段：长度小于 chunk_size 的短片段放进 good_splits 等待合并；长片段先把 good_splits 交给 _merge_splits 合并成块，再用剩余分隔符递归切这个片段，没有剩余分隔符时原样作为一块。第四步把最后剩下的 good_splits 合并成块，返回 list[str]。右侧列出四个要点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4841d"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:18px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .body{font-size:15px;fill:#17304b}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .yn{font-size:15px;font-weight:650;fill:#7a4300}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#c4841d;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-o)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .start{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .step{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .region{fill:#fbfcfe;stroke:#c3ccd8;stroke-width:1.5;stroke-dasharray:6 4}
      .short{fill:#eef5ff;stroke:#7fa8dc;stroke-width:1.6}
      .long{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.6}
      .diamond{fill:#ffffff;stroke:#64748b;stroke-width:1.6}
      .done{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .note{fill:#fff9ef;stroke:#e0a43a;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1200" height="870" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">RecursiveCharacterTextSplitter：递归切分的流程</text>
  <text x="36" y="82" class="sub">源码 character.py 的 _split_text（1.1.2）· separators 默认 ["\n\n", "\n", " ", ""]</text>

  <!-- 左：流程 -->
  <rect x="32" y="104" width="800" height="746" rx="16" class="panel"/>

  <rect x="222" y="122" width="420" height="48" rx="24" class="start"/>
  <text x="432" y="152" class="code-b" text-anchor="middle">_split_text(text, separators)</text>
  <path d="M 432 172 V 194" class="arrow"/>

  <rect x="72" y="198" width="720" height="92" rx="10" class="step"/>
  <text x="92" y="226" class="label">① 选分隔符</text>
  <text x="92" y="252" class="body">按顺序找第一个在 text 里出现的分隔符 sep；排到 "" 时直接用 ""（逐字符切）</text>
  <text x="92" y="276" class="small">剩余分隔符 = 列表里 sep 后面的部分</text>
  <path d="M 432 292 V 314" class="arrow"/>

  <rect x="72" y="318" width="720" height="68" rx="10" class="step"/>
  <text x="92" y="346" class="label">② 用 sep 把 text 切成片段</text>
  <text x="92" y="372" class="small">keep_separator 默认 True：分隔符留在下一个片段的开头</text>
  <path d="M 432 388 V 410" class="arrow"/>

  <!-- ③ 循环 -->
  <rect x="56" y="414" width="752" height="300" rx="12" class="region"/>
  <text x="76" y="442" class="label">③ 依次处理每个片段 s</text>
  <polygon points="302,488 432,452 562,488 432,524" class="diamond"/>
  <text x="432" y="493" class="code" text-anchor="middle">len(s) &lt; chunk_size ?</text>
  <path d="M 302 488 H 196 V 542" class="arrow"/>
  <text x="250" y="478" class="yn" text-anchor="middle">是</text>
  <path d="M 562 488 H 604 V 542" class="arrow"/>
  <text x="584" y="478" class="yn" text-anchor="middle">否</text>

  <rect x="80" y="546" width="232" height="148" rx="10" class="short"/>
  <text x="98" y="576" class="label">短片段</text>
  <text x="98" y="604" class="body">放进 good_splits，</text>
  <text x="98" y="628" class="body">等着和相邻的短片段</text>
  <text x="98" y="652" class="body">一起合并</text>

  <rect x="336" y="546" width="452" height="148" rx="10" class="long"/>
  <text x="354" y="576" class="label">长片段</text>
  <text x="354" y="604" class="body">a. 先把 good_splits 交给 _merge_splits 合并成块</text>
  <text x="354" y="628" class="body">b. 还有剩余分隔符：递归切这个片段</text>
  <text x="376" y="652" class="body">没有剩余分隔符：原样作为一块（不警告）</text>
  <text x="354" y="676" class="body">c. 清空 good_splits，处理下一个片段</text>

  <path d="M 788 628 H 816 V 146 H 646" class="loop"/>
  <text x="662" y="136" class="yn">递归切长片段</text>

  <path d="M 432 716 V 738" class="arrow"/>
  <rect x="72" y="742" width="720" height="88" rx="10" class="done"/>
  <text x="92" y="770" class="label">④ 片段处理完后，把剩下的 good_splits 合并成块</text>
  <text x="92" y="796" class="body">各级产生的块按原文顺序排好，返回 list[str]</text>
  <text x="92" y="818" class="small">split_text(text) 就是调用 _split_text(text, self._separators)</text>

  <!-- 右：要点 -->
  <rect x="856" y="104" width="312" height="746" rx="16" class="panel"/>
  <text x="876" y="138" class="label">从源码得出的要点</text>

  <rect x="872" y="154" width="280" height="132" rx="10" class="note"/>
  <text x="888" y="182" class="body">1. 分隔符按列表顺序挑，用第一</text>
  <text x="888" y="206" class="body">个“在文本里出现”的；文本里没</text>
  <text x="888" y="230" class="body">有的分隔符直接跳过，不是逐级</text>
  <text x="888" y="254" class="body">都试一遍</text>

  <rect x="872" y="298" width="280" height="156" rx="10" class="note"/>
  <text x="888" y="326" class="body">2. 合并只发生在同一层、相邻的</text>
  <text x="888" y="350" class="body">短片段之间。不同分支切出的块</text>
  <text x="888" y="374" class="body">不会再合并，所以块可能远小于</text>
  <text x="888" y="398" class="body">chunk_size（案例一的块 2 只有</text>
  <text x="888" y="422" class="body">3 个字）</text>

  <rect x="872" y="466" width="280" height="108" rx="10" class="note"/>
  <text x="888" y="494" class="body">3. chunk_overlap 也只在同一次</text>
  <text x="888" y="518" class="body">_merge_splits 里生效：分支之</text>
  <text x="888" y="542" class="body">间的块没有重叠</text>

  <rect x="872" y="586" width="280" height="148" rx="10" class="note"/>
  <text x="888" y="614" class="body">4. 默认列表以 "" 结尾：长片段最</text>
  <text x="888" y="638" class="body">终会逐字符切开，所以块不会超</text>
  <text x="888" y="662" class="body">过 chunk_size。自定义列表去</text>
  <text x="888" y="686" class="body">掉 "" 后，切到最后仍然超长的</text>
  <text x="888" y="710" class="body">片段会原样保留，而且没有警告</text>
</svg>
