<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">按文件格式选择读取方法</title>
  <desc id="desc">txt、Markdown、JSON、CSV 用 Python 标准库读取并自己构造 Document；文字型 PDF 用 pypdf；需要保留标题和表格的 PDF 用 PyMuPDF4LLM；扫描件和复杂版面用 Docling 或 Unstructured，本地运行需要 PyTorch；Word、HTML 等用 MarkItDown、Docling 或 Unstructured；网页用 requests 获取后转成 Markdown。最后都得到 Document 列表，交给文本切分器。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .col{font-size:16px;font-weight:650;fill:#52677e}
      .fmt{font-size:18px;font-weight:650}
      .tool{font-size:18px;font-weight:650;fill:#1d4f91}
      .small{font-size:15px;fill:#52677e}
      .out{font-size:16px;fill:#127a4b;font-weight:600}
      .tag{font-size:13px;font-weight:650}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .fmtbox{fill:#f3fbe4;stroke:#a9cc5a;stroke-width:1.5}
      .toolbox{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .toolbox-skip{fill:#f4f6f9;stroke:#a7b3c2;stroke-width:1.5;stroke-dasharray:7 4}
      .outbox{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .ran{fill:#e9f8f1;stroke:#9ad4b6}
      .skip{fill:#fdeeee;stroke:#f0b8b8}
      .final{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.8}
    </style>
  </defs>
  <rect width="1240" height="800" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">把文件读成 Document：按格式选工具，尽量输出 Markdown</text>
  <text x="36" y="82" class="sub">都不依赖 langchain-community · 括号里是本笔记的小节 · 虚线框的 PDF 部分本笔记没有运行</text>

  <text x="52" y="124" class="col">文件格式</text>
  <text x="372" y="124" class="col">推荐做法</text>
  <text x="952" y="124" class="col">page_content 的形式</text>

  <!-- 1 简单格式 -->
  <rect x="52" y="138" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="186" class="fmt">txt、Markdown、JSON、CSV</text>
  <path d="M 336 180 H 366" class="arrow"/>
  <rect x="372" y="138" width="540" height="84" rx="10" class="toolbox"/>
  <text x="390" y="170" class="tool">Python 标准库读取，自己构造 Document</text>
  <text x="390" y="200" class="small">需要统一的 load() / lazy_load() 接口：继承 BaseLoader（§1）</text>
  <path d="M 916 180 H 946" class="arrow"/>
  <rect x="952" y="138" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="186" class="out">原文本</text>

  <!-- 2 pypdf -->
  <rect x="52" y="236" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="270" class="fmt">PDF：文字型</text>
  <text x="70" y="298" class="small">只要文本</text>
  <path d="M 336 278 H 366" class="arrow"/>
  <rect x="372" y="236" width="540" height="84" rx="10" class="toolbox"/>
  <text x="390" y="268" class="tool">pypdf，逐页构造 Document</text>
  <text x="390" y="298" class="small">官方语义搜索教程的写法；表格会被拉平成一行行文字（§2.1）</text>
  <path d="M 916 278 H 946" class="arrow"/>
  <rect x="952" y="236" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="270" class="out">纯文本</text>
  <text x="970" y="298" class="small">每页一个 Document</text>

  <!-- 3 PyMuPDF4LLM -->
  <rect x="52" y="334" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="368" class="fmt">PDF：要保留结构</text>
  <text x="70" y="396" class="small">标题、表格</text>
  <path d="M 336 376 H 366" class="arrow"/>
  <rect x="372" y="334" width="540" height="84" rx="10" class="toolbox"/>
  <text x="390" y="366" class="tool">PyMuPDF4LLM（langchain-pymupdf4llm）</text>
  <text x="390" y="396" class="small">表格转成 Markdown 表格；许可证是 AGPL，商用要注意（§2.2）</text>
  <path d="M 916 376 H 946" class="arrow"/>
  <rect x="952" y="334" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="368" class="out">Markdown</text>
  <text x="970" y="396" class="small">每页一个，或整份一个</text>

  <!-- 4 扫描件 -->
  <rect x="52" y="432" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="466" class="fmt">PDF：扫描件、复杂版面</text>
  <text x="70" y="494" class="small">需要 OCR、版面分析</text>
  <path d="M 336 474 H 366" class="arrow"/>
  <rect x="372" y="432" width="540" height="84" rx="10" class="toolbox-skip"/>
  <text x="390" y="464" class="tool">Docling / Unstructured（本地运行要装 PyTorch）</text>
  <text x="390" y="494" class="small">中文扫描件还可以看 MinerU、PaddleOCR-VL（§2.3）</text>
  <path d="M 916 474 H 946" class="arrow"/>
  <rect x="952" y="432" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="466" class="out">Markdown / 元素</text>
  <text x="970" y="494" class="small">取决于工具和参数</text>

  <!-- 5 Office / HTML -->
  <rect x="52" y="530" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="564" class="fmt">Word、PPT、Excel、HTML</text>
  <text x="70" y="592" class="small">本地文件</text>
  <path d="M 336 572 H 366" class="arrow"/>
  <rect x="372" y="530" width="540" height="84" rx="10" class="toolbox"/>
  <text x="390" y="562" class="tool">MarkItDown；或 Docling、Unstructured</text>
  <text x="390" y="592" class="small">前两个转成 Markdown，Unstructured 按标题、段落等元素拆开（§3）</text>
  <path d="M 916 572 H 946" class="arrow"/>
  <rect x="952" y="530" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="564" class="out">Markdown / 元素</text>
  <text x="970" y="592" class="small">取决于工具</text>

  <!-- 6 网页 -->
  <rect x="52" y="628" width="280" height="84" rx="10" class="fmtbox"/>
  <text x="70" y="676" class="fmt">网页</text>
  <path d="M 336 670 H 366" class="arrow"/>
  <rect x="372" y="628" width="540" height="84" rx="10" class="toolbox"/>
  <text x="390" y="660" class="tool">requests 取回页面，再转成 Markdown</text>
  <text x="390" y="690" class="small">官方 RAG 教程直接取文档站的 .md 页面（§4）</text>
  <path d="M 916 670 H 946" class="arrow"/>
  <rect x="952" y="628" width="256" height="84" rx="10" class="outbox"/>
  <text x="970" y="676" class="out">Markdown</text>

  <!-- 结果 -->
  <rect x="52" y="730" width="1156" height="50" rx="10" class="final"/>
  <text x="72" y="762" class="small" style="fill:#7a4300">最后都得到 list[Document]：page_content 是文本（尽量是 Markdown，保留标题和表格），metadata 记来源、页码等，下一步交给文本切分器</text>
</svg>
