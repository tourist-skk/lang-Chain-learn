<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">create_collection 快速模式做了什么</title>
  <desc id="desc">左侧是 create_collection 只传 dimension 时源码执行的四步：建 schema（主键 id 为 INT64，向量字段 vector 为 FLOAT_VECTOR，维度 2048，打开动态字段）；创建 collection（一致性级别默认 Bounded，Milvus Lite 只支持 Strong）；给 vector 字段建 AUTOINDEX 索引，度量为 COSINE；load 到内存。右侧是一条数据字典如何对应到字段：id 进主键字段，vector 进向量字段，长度必须等于 dim，text 和 source 不在 schema 里，进入动态字段 $meta。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:18px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .body{font-size:15px;fill:#17304b}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#17304b}
      .reqtext{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#e6edf5}
      .key{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#ffd58a}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .start{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .step{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .field{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .dyn{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
      .req{fill:#1f2a37;stroke:#1f2a37}
      .note{fill:#fff9ef;stroke:#e0a43a;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1200" height="720" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">create_collection 快速模式做了什么</text>
  <text x="36" y="82" class="sub">pymilvus 3.0.2 的 _fast_create_collection · 只传 dimension、不传 schema 时走这条路</text>

  <!-- 左：四步 -->
  <rect x="32" y="104" width="560" height="508" rx="16" class="panel"/>
  <rect x="56" y="122" width="512" height="46" rx="23" class="start"/>
  <text x="312" y="151" class="code-b" text-anchor="middle">create_collection("docs", dimension=2048)</text>
  <path d="M 312 168 L 312 186" class="arrow"/>

  <rect x="56" y="190" width="512" height="128" rx="12" class="step"/>
  <text x="76" y="218" class="label">① 建 schema（字段定义）</text>
  <text x="76" y="246" class="code">id      INT64 主键</text>
  <text x="300" y="246" class="small">primary_field_name、id_type</text>
  <text x="76" y="272" class="code">vector  FLOAT_VECTOR(2048)</text>
  <text x="330" y="272" class="small">vector_field_name、dimension</text>
  <text x="76" y="298" class="code">enable_dynamic_field=True</text>
  <text x="330" y="298" class="small">没传时默认打开</text>
  <path d="M 312 318 L 312 334" class="arrow"/>

  <rect x="56" y="338" width="512" height="72" rx="12" class="step"/>
  <text x="76" y="366" class="label">② 创建 collection</text>
  <text x="76" y="392" class="body">一致性级别默认 Bounded；Milvus Lite 只支持 Strong</text>
  <path d="M 312 410 L 312 426" class="arrow"/>

  <rect x="56" y="430" width="512" height="72" rx="12" class="step"/>
  <text x="76" y="458" class="label">③ 给 vector 字段建索引</text>
  <text x="76" y="484" class="code">index_type="AUTOINDEX", metric_type="COSINE"</text>
  <path d="M 312 502 L 312 518" class="arrow"/>

  <rect x="56" y="522" width="512" height="72" rx="12" class="step"/>
  <text x="76" y="550" class="label">④ load_collection</text>
  <text x="76" y="576" class="body">把 collection 载入内存，之后才能 search、query</text>

  <!-- 右：一条数据怎么对应到字段 -->
  <rect x="612" y="104" width="556" height="508" rx="16" class="panel"/>
  <text x="636" y="140" class="label">upsert 的一条数据怎么存</text>

  <rect x="636" y="158" width="508" height="150" rx="10" class="req"/>
  <text x="656" y="188" class="reqtext">{</text>
  <text x="676" y="214" class="key">"id"</text><text x="716" y="214" class="reqtext">: 0,</text>
  <text x="676" y="240" class="key">"vector"</text><text x="752" y="240" class="reqtext">: [0.043, -0.019, …],</text>
  <text x="676" y="266" class="key">"text"</text><text x="732" y="266" class="reqtext">: "LangChain 是…",</text>
  <text x="676" y="292" class="key">"source"</text><text x="752" y="292" class="reqtext">: "demo"  }</text>

  <rect x="636" y="352" width="156" height="92" rx="12" class="field"/>
  <text x="714" y="384" class="code-b" text-anchor="middle">id</text>
  <text x="714" y="410" class="small" text-anchor="middle">主键字段</text>
  <text x="714" y="430" class="small" text-anchor="middle">相同时 upsert 覆盖</text>

  <rect x="812" y="352" width="156" height="92" rx="12" class="field"/>
  <text x="890" y="384" class="code-b" text-anchor="middle">vector</text>
  <text x="890" y="410" class="small" text-anchor="middle">向量字段</text>
  <text x="890" y="430" class="small" text-anchor="middle">长度必须 = 2048</text>

  <rect x="988" y="352" width="156" height="92" rx="12" class="dyn"/>
  <text x="1066" y="384" class="code-b" text-anchor="middle">$meta</text>
  <text x="1066" y="410" class="small" text-anchor="middle">动态字段（JSON）</text>
  <text x="1066" y="430" class="small" text-anchor="middle">text、source 放这里</text>

  <path d="M 700 308 L 700 346" class="arrow"/>
  <path d="M 860 308 L 880 346" class="arrow"/>
  <path d="M 1010 308 L 1050 346" class="arrow"/>

  <rect x="636" y="466" width="508" height="128" rx="12" class="note"/>
  <text x="656" y="494" class="body">schema 里没有的键（text、source）都进 $meta。</text>
  <text x="656" y="520" class="body">查询、过滤时直接写键名：filter='source == "demo"'。</text>
  <text x="656" y="546" class="body">关掉动态字段时，多出来的键会报 DataNotMatchException。</text>
  <text x="656" y="572" class="small">describe_collection 的 fields 里看不到 $meta，它是隐藏字段。</text>

  <!-- 底部 -->
  <rect x="32" y="628" width="1136" height="72" rx="12" class="note"/>
  <text x="56" y="656" class="body">自定义模式：先用 create_schema() 定义字段、prepare_index_params() 定义索引，再传 schema= 和 index_params=。</text>
  <text x="56" y="682" class="small">这时上面的 dimension、metric_type 等快速参数不再起作用。</text>
</svg>
