<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1130" viewBox="0 0 1360 1130" role="img" aria-labelledby="title desc">
  <title id="title">三种 RAG 架构：2-Step、Agentic、Hybrid</title>
  <desc id="desc">2-Step RAG：用户问题、检索相关文档、生成答案、返回，流程固定。Agentic RAG：Agent 判断是否需要外部信息，需要就用工具检索，再判断信息是否足够，不够回到 Agent 继续推理，够了就生成最终答案。Hybrid RAG：先做查询增强，再检索，信息不足就改写查询重新检索；生成答案后检查质量，不合格可以换方法改写查询，或者返回目前最好的答案。下方对比三者由谁决定检索、可控性、灵活性、延迟和官方举的场景。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .head{font-size:22px;font-weight:700}
      .node{font-size:17px}
      .dec{font-size:16px}
      .yn{font-size:15px;fill:#52677e;font-weight:650}
      .k{font-size:15px;fill:#52677e}
      .v{font-size:15px;fill:#17304b}
      .v-hi{font-size:15px;fill:#127a4b;font-weight:650}
      .v-lo{font-size:15px;fill:#b42318}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .start{fill:#f3fbe4;stroke:#a9cc5a;stroke-width:1.5}
      .proc{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .ret{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.8}
      .decision{fill:#f6f0ff;stroke:#a993d6;stroke-width:1.5}
      .div{stroke:#dce4ee;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1360" height="1130" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">三种 RAG 架构：区别在于检索什么时候发生、由谁决定</text>
  <text x="36" y="82" class="sub">按官方 Retrieval 页 RAG architectures 一节的流程图重画 · 橙色方框是检索发生的位置</text>

  <!-- ===== 2-Step RAG ===== -->
  <rect x="32" y="108" width="320" height="992" rx="16" class="panel"/>
  <text x="52" y="142" class="head">2-Step RAG</text>
  <text x="52" y="168" class="k">检索一定在生成之前</text>

  <rect x="92" y="196" width="200" height="46" rx="23" class="start"/>
  <text x="192" y="225" class="node" text-anchor="middle">用户问题</text>
  <path d="M 192 244 V 278" class="arrow"/>
  <rect x="92" y="282" width="200" height="46" rx="10" class="ret"/>
  <text x="192" y="311" class="node" text-anchor="middle">检索相关文档</text>
  <path d="M 192 330 V 364" class="arrow"/>
  <rect x="92" y="368" width="200" height="46" rx="10" class="proc"/>
  <text x="192" y="397" class="node" text-anchor="middle">生成答案</text>
  <path d="M 192 416 V 450" class="arrow"/>
  <rect x="92" y="454" width="200" height="46" rx="23" class="start"/>
  <text x="192" y="483" class="node" text-anchor="middle">返回给用户</text>

  <text x="192" y="560" class="k" text-anchor="middle">LLM 只在“生成答案”时调用一次</text>
  <text x="192" y="586" class="k" text-anchor="middle">调用次数固定，延迟可预期</text>

  <!-- ===== Agentic RAG ===== -->
  <rect x="368" y="108" width="440" height="992" rx="16" class="panel"/>
  <text x="388" y="142" class="head">Agentic RAG</text>
  <text x="388" y="168" class="k">Agent 推理时自己决定何时检索、怎样检索</text>

  <rect x="488" y="196" width="200" height="46" rx="23" class="start"/>
  <text x="588" y="225" class="node" text-anchor="middle">用户问题</text>
  <path d="M 588 244 V 278" class="arrow"/>
  <rect x="488" y="282" width="200" height="46" rx="10" class="proc"/>
  <text x="588" y="311" class="node" text-anchor="middle">Agent（LLM）</text>
  <path d="M 588 330 V 362" class="arrow"/>
  <polygon points="588,366 688,402 588,438 488,402" class="decision"/>
  <text x="588" y="408" class="dec" text-anchor="middle">需要外部信息？</text>
  <path d="M 588 440 V 474" class="arrow"/>
  <text x="598" y="462" class="yn">是</text>
  <rect x="488" y="478" width="200" height="46" rx="10" class="ret"/>
  <text x="588" y="507" class="node" text-anchor="middle">用工具检索</text>
  <path d="M 588 526 V 560" class="arrow"/>
  <polygon points="588,564 688,600 588,636 488,600" class="decision"/>
  <text x="588" y="606" class="dec" text-anchor="middle">信息够回答了吗？</text>
  <path d="M 588 638 V 672" class="arrow"/>
  <text x="598" y="660" class="yn">是</text>
  <rect x="488" y="676" width="200" height="46" rx="10" class="proc"/>
  <text x="588" y="705" class="node" text-anchor="middle">生成最终答案</text>
  <path d="M 588 724 V 758" class="arrow"/>
  <rect x="488" y="762" width="200" height="46" rx="23" class="start"/>
  <text x="588" y="791" class="node" text-anchor="middle">返回给用户</text>
  <!-- 不需要外部信息：直接回答 -->
  <path d="M 688 402 H 760 V 699 H 692" class="arrow"/>
  <text x="702" y="392" class="yn">否</text>
  <!-- 信息不够：回到 Agent -->
  <path d="M 488 600 H 418 V 305 H 484" class="arrow"/>
  <text x="474" y="590" class="yn" text-anchor="end">否</text>

  <text x="588" y="856" class="k" text-anchor="middle">检索只是 Agent 的一个工具</text>
  <text x="588" y="882" class="k" text-anchor="middle">调不调、调几次由模型决定</text>

  <!-- ===== Hybrid RAG ===== -->
  <rect x="824" y="108" width="504" height="992" rx="16" class="panel"/>
  <text x="844" y="142" class="head">Hybrid RAG</text>
  <text x="844" y="168" class="k">结合前两者，并在检索前后、生成后加入检查</text>

  <rect x="900" y="196" width="200" height="46" rx="23" class="start"/>
  <text x="1000" y="225" class="node" text-anchor="middle">用户问题</text>
  <path d="M 1000 244 V 278" class="arrow"/>
  <rect x="900" y="282" width="200" height="46" rx="10" class="proc"/>
  <text x="1000" y="311" class="node" text-anchor="middle">查询增强</text>
  <path d="M 1000 330 V 364" class="arrow"/>
  <rect x="900" y="368" width="200" height="46" rx="10" class="ret"/>
  <text x="1000" y="397" class="node" text-anchor="middle">检索文档</text>
  <path d="M 1000 416 V 448" class="arrow"/>
  <polygon points="1000,452 1100,488 1000,524 900,488" class="decision"/>
  <text x="1000" y="494" class="dec" text-anchor="middle">信息足够？</text>
  <path d="M 1000 526 V 560" class="arrow"/>
  <text x="1010" y="548" class="yn">是</text>
  <rect x="900" y="564" width="200" height="46" rx="10" class="proc"/>
  <text x="1000" y="593" class="node" text-anchor="middle">生成答案</text>
  <path d="M 1000 612 V 644" class="arrow"/>
  <polygon points="1000,648 1100,684 1000,720 900,684" class="decision"/>
  <text x="1000" y="690" class="dec" text-anchor="middle">答案质量 OK？</text>
  <path d="M 1000 722 V 756" class="arrow"/>
  <text x="1010" y="744" class="yn">是</text>
  <rect x="900" y="760" width="200" height="46" rx="10" class="proc"/>
  <text x="1000" y="789" class="node" text-anchor="middle">返回最佳答案</text>
  <path d="M 1000 808 V 842" class="arrow"/>
  <rect x="900" y="846" width="200" height="46" rx="23" class="start"/>
  <text x="1000" y="875" class="node" text-anchor="middle">返回给用户</text>

  <!-- 侧边：改写查询 / 换个方法 -->
  <rect x="1160" y="465" width="140" height="46" rx="10" class="proc"/>
  <text x="1230" y="494" class="node" text-anchor="middle">改写查询</text>
  <path d="M 1100 488 H 1156" class="arrow"/>
  <text x="1114" y="478" class="yn">否</text>
  <path d="M 1230 463 V 391 H 1104" class="arrow"/>

  <polygon points="1230,652 1300,684 1230,716 1160,684" class="decision"/>
  <text x="1230" y="690" class="dec" text-anchor="middle">换个方法？</text>
  <path d="M 1100 684 H 1156" class="arrow"/>
  <text x="1114" y="674" class="yn">否</text>
  <path d="M 1230 650 V 515" class="arrow"/>
  <text x="1240" y="600" class="yn">是</text>
  <path d="M 1230 718 V 783 H 1104" class="arrow"/>
  <text x="1240" y="752" class="yn">否</text>

  <!-- ===== 对比 ===== -->
  <line x1="52" y1="924" x2="332" y2="924" class="div"/>
  <line x1="388" y1="924" x2="788" y2="924" class="div"/>
  <line x1="844" y1="924" x2="1308" y2="924" class="div"/>

  <text x="52" y="956" class="k">谁决定检索</text><text x="170" y="956" class="v">程序：固定先检索后生成</text>
  <text x="52" y="986" class="k">可控性</text><text x="170" y="986" class="v-hi">高</text>
  <text x="52" y="1016" class="k">灵活性</text><text x="170" y="1016" class="v-lo">低</text>
  <text x="52" y="1046" class="k">延迟</text><text x="170" y="1046" class="v-hi">快，可预期</text>
  <text x="52" y="1076" class="k">官方举的场景</text><text x="170" y="1076" class="v">FAQ、文档问答机器人</text>

  <text x="388" y="956" class="k">谁决定检索</text><text x="506" y="956" class="v">模型：Agent 推理时决定</text>
  <text x="388" y="986" class="k">可控性</text><text x="506" y="986" class="v-lo">低</text>
  <text x="388" y="1016" class="k">灵活性</text><text x="506" y="1016" class="v-hi">高</text>
  <text x="388" y="1046" class="k">延迟</text><text x="506" y="1046" class="v">不固定</text>
  <text x="388" y="1076" class="k">官方举的场景</text><text x="506" y="1076" class="v">能调用多个工具的研究助手</text>

  <text x="844" y="956" class="k">谁决定检索</text><text x="962" y="956" class="v">程序定流程，模型做检查</text>
  <text x="844" y="986" class="k">可控性</text><text x="962" y="986" class="v">中</text>
  <text x="844" y="1016" class="k">灵活性</text><text x="962" y="1016" class="v">中</text>
  <text x="844" y="1046" class="k">延迟</text><text x="962" y="1046" class="v">不固定</text>
  <text x="844" y="1076" class="k">官方举的场景</text><text x="962" y="1076" class="v">需要质量校验的专业领域问答</text>
</svg>
