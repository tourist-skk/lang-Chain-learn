<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">BaseLoader：子类只实现 lazy_load，其余方法由它派生</title>
  <desc id="desc">TextLoader、CSVLoader、JSONLoader 等子类只实现 lazy_load 生成器。BaseLoader 用它实现 load（一次取完返回列表）、load_and_split（load 后切分，已不推荐）、alazy_load（在线程池里逐个取）和 aload（收集 alazy_load 的结果）。下方对比 load 一次把全部 Document 放进内存，lazy_load 逐个取用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .ret{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#1d4f91}
      .core-text{font-size:15px;fill:#7a4300}
      .dep-text{font-size:15px;fill:#8a94a3}
      .doc{font-size:14px;fill:#127a4b;font-weight:600}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .line{fill:none;stroke:#64748b;stroke-width:2}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .sub-card{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .core{fill:#fff5e4;stroke:#e0a43a;stroke-width:2}
      .method{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .dep{fill:#f4f6f9;stroke:#c3ccd8;stroke-width:1.5;stroke-dasharray:7 4}
      .docbox{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1160" height="760" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">BaseLoader：子类只实现 lazy_load()，其余方法都由它派生</text>
  <text x="36" y="82" class="sub">源码位置 langchain_core/document_loaders/base.py · 蓝色等宽字是返回值类型</text>

  <!-- 子类 -->
  <rect x="32" y="108" width="340" height="440" rx="16" class="panel"/>
  <text x="52" y="140" class="label">子类：实现 lazy_load()</text>
  <rect x="52" y="150" width="300" height="80" rx="10" class="sub-card"/>
  <text x="70" y="182" class="code-b">TextLoader</text>
  <text x="70" y="212" class="small">整个文件 → 1 个 Document</text>
  <rect x="52" y="250" width="300" height="80" rx="10" class="sub-card"/>
  <text x="70" y="282" class="code-b">CSVLoader</text>
  <text x="70" y="312" class="small">每一行 → 1 个 Document</text>
  <rect x="52" y="350" width="300" height="80" rx="10" class="sub-card"/>
  <text x="70" y="382" class="code-b">JSONLoader</text>
  <text x="70" y="412" class="small">jq 的每个结果 → 1 个 Document</text>
  <text x="52" y="470" class="small">每产出一个 Document，就 yield 一次</text>
  <text x="52" y="496" class="small">BaseLoader 自己的 lazy_load() 只会报</text>
  <text x="52" y="518" class="small">NotImplementedError</text>

  <path d="M 352 190 H 386" class="line"/>
  <path d="M 352 290 H 386" class="line"/>
  <path d="M 352 390 H 386" class="line"/>
  <path d="M 386 190 V 390" class="line"/>
  <path d="M 386 300 H 416" class="arrow"/>

  <!-- 核心：lazy_load -->
  <rect x="420" y="240" width="230" height="120" rx="12" class="core"/>
  <text x="535" y="274" class="code-b" text-anchor="middle">lazy_load()</text>
  <text x="535" y="300" class="ret" text-anchor="middle">→ Iterator[Document]</text>
  <text x="535" y="326" class="core-text" text-anchor="middle">生成器：每 next() 一次</text>
  <text x="535" y="348" class="core-text" text-anchor="middle">才产出一个 Document</text>

  <!-- BaseLoader 提供的方法 -->
  <rect x="698" y="108" width="430" height="440" rx="16" class="panel"/>
  <text x="718" y="140" class="label">BaseLoader 提供：基于 lazy_load() 实现</text>

  <rect x="718" y="150" width="390" height="72" rx="10" class="method"/>
  <text x="734" y="180" class="code-b">load()</text>
  <text x="820" y="180" class="ret">→ list[Document]</text>
  <text x="734" y="206" class="small">list(self.lazy_load())：一次全部取完</text>
  <path d="M 913 224 V 246" class="arrow"/>

  <rect x="718" y="250" width="390" height="72" rx="10" class="dep"/>
  <text x="734" y="280" class="code" style="fill:#8a94a3">load_and_split(text_splitter=None)</text>
  <text x="734" y="306" class="dep-text">load() 后再切分 · 源码注释：应视为已弃用</text>

  <rect x="718" y="356" width="390" height="72" rx="10" class="method"/>
  <text x="734" y="386" class="code-b">alazy_load()</text>
  <text x="866" y="386" class="ret">→ AsyncIterator[Document]</text>
  <text x="734" y="412" class="small">在线程池里逐个调用 lazy_load 的 next()</text>
  <path d="M 913 430 V 452" class="arrow"/>

  <rect x="718" y="456" width="390" height="72" rx="10" class="method"/>
  <text x="734" y="486" class="code-b">aload()</text>
  <text x="820" y="486" class="ret">→ list[Document]</text>
  <text x="734" y="512" class="small">async 版 load()：收集 alazy_load 的全部结果</text>

  <path d="M 652 280 H 684 V 186 H 714" class="arrow"/>
  <path d="M 652 320 H 684 V 392 H 714" class="arrow"/>

  <!-- load 与 lazy_load 的区别 -->
  <rect x="32" y="572" width="1096" height="168" rx="16" class="panel"/>
  <text x="52" y="604" class="label">load() 和 lazy_load() 的区别：同一时间内存里有几个 Document</text>

  <text x="52" y="656" class="code">docs = loader.load()</text>
  <rect x="380" y="630" width="70" height="36" rx="6" class="docbox"/><text x="415" y="654" class="doc" text-anchor="middle">Doc 1</text>
  <rect x="460" y="630" width="70" height="36" rx="6" class="docbox"/><text x="495" y="654" class="doc" text-anchor="middle">Doc 2</text>
  <rect x="540" y="630" width="70" height="36" rx="6" class="docbox"/><text x="575" y="654" class="doc" text-anchor="middle">Doc 3</text>
  <rect x="620" y="630" width="70" height="36" rx="6" class="docbox"/><text x="655" y="654" class="doc" text-anchor="middle">Doc 4</text>
  <text x="712" y="654" class="small">…</text>
  <rect x="740" y="630" width="70" height="36" rx="6" class="docbox"/><text x="775" y="654" class="doc" text-anchor="middle">Doc n</text>
  <text x="900" y="654" class="small">n 个同时在内存里，适合小文件</text>

  <text x="52" y="712" class="code">for doc in loader.lazy_load():</text>
  <rect x="380" y="686" width="70" height="36" rx="6" class="docbox"/><text x="415" y="710" class="doc" text-anchor="middle">Doc 1</text>
  <path d="M 454 704 H 520" class="arrow"/><text x="487" y="696" class="small" text-anchor="middle">处理</text>
  <rect x="524" y="686" width="70" height="36" rx="6" class="docbox"/><text x="559" y="710" class="doc" text-anchor="middle">Doc 2</text>
  <path d="M 598 704 H 664" class="arrow"/><text x="631" y="696" class="small" text-anchor="middle">处理</text>
  <rect x="668" y="686" width="70" height="36" rx="6" class="docbox"/><text x="703" y="710" class="doc" text-anchor="middle">Doc 3</text>
  <text x="756" y="710" class="small">…</text>
  <text x="900" y="710" class="small">逐个取用，适合大文件、多文件</text>
</svg>
