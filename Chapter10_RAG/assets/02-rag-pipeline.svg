<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="704" viewBox="0 0 1320 704" role="img" aria-labelledby="title desc">
  <title id="title">RAG 工作流程：索引阶段与检索生成阶段</title>
  <desc id="desc">阶段一索引：数据源经文档加载器变成 Document，经文本切分器切成小块，经嵌入模型变成向量，连同原文和元数据存入向量库。阶段二检索与生成：用户问题用同一个嵌入模型向量化，检索器在向量库中做相似度搜索取回 top-k 个片段，聊天模型把问题和片段拼成提示词生成回答。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a1b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .name{font-size:17px;font-weight:650}
      .comp{font-size:16px;fill:#1d4f91;font-weight:600}
      .small{font-size:15px;fill:#52677e}
      .from-mem{font-size:15px;fill:#9a5b00;font-weight:600}
      .badge-text{font-size:13px;fill:#9a5b00;font-weight:650}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-mem{fill:none;stroke:#c98a1b;stroke-width:2.2;marker-end:url(#arrow-mem)}
      .arrow-q{fill:none;stroke:#7fa8de;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .src{fill:#f3fbe4;stroke:#a9cc5a;stroke-width:1.5}
      .proc{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .proc-new{fill:#eef5ff;stroke:#7fa8de;stroke-width:1.8;stroke-dasharray:7 4}
      .store{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.8}
      .good{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .badge{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1320" height="704" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">RAG 工作流程：先离线建好索引，每次提问时再检索并生成</text>
  <text x="36" y="82" class="sub">方框第二行是 LangChain 中负责这一步的组件 · 第三、四行是这一步的输入 → 输出</text>

  <!-- 阶段一：索引 -->
  <rect x="32" y="108" width="1256" height="212" rx="16" class="panel"/>
  <text x="52" y="140" class="label">阶段一 · 索引（Indexing）：提前离线执行，文档有变化时再更新</text>

  <rect x="52" y="164" width="210" height="132" rx="10" class="src"/>
  <text x="68" y="196" class="name">环节1 · Source 数据源</text>
  <text x="68" y="226" class="comp">数据从哪里来</text>
  <text x="68" y="256" class="small">PDF、Word、网页、</text>
  <text x="68" y="278" class="small">Notion、数据库…</text>
  <path d="M 268 230 H 296" class="arrow"/>

  <rect x="302" y="164" width="210" height="132" rx="10" class="proc"/>
  <text x="318" y="196" class="name">环节2 · Load 加载</text>
  <text x="318" y="226" class="comp">Document Loaders</text>
  <text x="318" y="256" class="small">文件 →</text>
  <text x="318" y="278" class="small">list[Document]</text>
  <path d="M 518 230 H 546" class="arrow"/>

  <rect x="552" y="164" width="210" height="132" rx="10" class="proc"/>
  <text x="568" y="196" class="name">环节3 · Split 切分</text>
  <text x="568" y="226" class="comp">Text Splitters</text>
  <text x="568" y="256" class="small">长 Document →</text>
  <text x="568" y="278" class="small">多个小块（chunk）</text>
  <path d="M 768 230 H 796" class="arrow"/>

  <rect x="802" y="164" width="210" height="132" rx="10" class="proc"/>
  <text x="818" y="196" class="name">环节4 · Embed 向量化</text>
  <text x="818" y="226" class="comp">Embedding 模型</text>
  <text x="818" y="256" class="small">每个 chunk →</text>
  <text x="818" y="278" class="small">一个向量 list[float]</text>
  <path d="M 1018 230 H 1046" class="arrow"/>

  <rect x="1052" y="164" width="210" height="132" rx="10" class="store"/>
  <text x="1068" y="196" class="name">环节5 · Store 存储</text>
  <text x="1068" y="226" class="comp">Vector Store</text>
  <text x="1068" y="256" class="small">向量 + 原文 + metadata</text>
  <text x="1068" y="278" class="small">一起存入向量库</text>

  <!-- 阶段二：检索与生成 -->
  <rect x="32" y="380" width="1256" height="272" rx="16" class="panel"/>
  <text x="52" y="412" class="label">阶段二 · 检索与生成：每次用户提问时在线执行</text>

  <rect x="52" y="436" width="210" height="132" rx="10" class="src"/>
  <text x="68" y="468" class="name">用户问题</text>
  <text x="68" y="498" class="comp">query: str</text>
  <text x="68" y="528" class="small">例如“上海住宿每晚</text>
  <text x="68" y="550" class="small">能报多少？”</text>
  <path d="M 268 502 H 296" class="arrow"/>

  <rect x="302" y="436" width="210" height="132" rx="10" class="proc"/>
  <text x="318" y="468" class="name">问题向量化</text>
  <text x="318" y="498" class="comp">同一个 Embedding 模型</text>
  <text x="318" y="528" class="small">embed_query(问题)</text>
  <text x="318" y="550" class="small">→ 一个向量</text>
  <path d="M 518 502 H 546" class="arrow"/>

  <rect x="552" y="436" width="210" height="132" rx="10" class="proc"/>
  <text x="568" y="468" class="name">环节6 · Retrieve 检索</text>
  <text x="568" y="498" class="comp">Retriever</text>
  <text x="568" y="528" class="small">问题 →</text>
  <text x="568" y="550" class="small">top-k 个 Document</text>
  <path d="M 768 502 H 796" class="arrow"/>

  <rect x="802" y="436" width="210" height="132" rx="10" class="proc-new"/>
  <rect x="908" y="425" width="96" height="22" rx="11" class="badge"/>
  <text x="956" y="441" class="badge-text" text-anchor="middle">v0.1 图中没有</text>
  <text x="818" y="468" class="name">环节7 · Generate 生成</text>
  <text x="818" y="498" class="comp">Chat Model</text>
  <text x="818" y="528" class="small">问题 + 片段 → 提示词</text>
  <text x="818" y="550" class="small">→ 回答</text>
  <path d="M 1018 502 H 1046" class="arrow"/>

  <rect x="1052" y="436" width="210" height="132" rx="10" class="good"/>
  <text x="1068" y="468" class="name">回答</text>
  <text x="1068" y="498" class="comp">AIMessage</text>
  <text x="1068" y="528" class="small">可以注明出处</text>
  <text x="1068" y="550" class="small">（来自片段的 metadata）</text>

  <!-- 向量库 → 检索 -->
  <path d="M 1157 298 V 358 H 712 V 430" class="arrow-mem"/>
  <text x="935" y="350" class="from-mem" text-anchor="middle">Retriever 拿问题向量到向量库里做相似度搜索，取回 top-k 个片段</text>

  <!-- 问题也带给生成 -->
  <path d="M 157 570 V 606 H 907 V 574" class="arrow-q"/>
  <text x="532" y="630" class="small" text-anchor="middle">问题本身也要放进提示词</text>

  <text x="36" y="684" class="sub">环节4 和“问题向量化”必须用同一个 Embedding 模型：向量只有在同一个向量空间里比较才有意义</text>
</svg>
