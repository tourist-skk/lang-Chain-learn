<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">OpenAIEmbeddings.embed_documents 的请求流程</title>
  <desc id="desc">embed_documents 先看 check_embedding_ctx_length。默认 True：用 tiktoken 选分词器，不认识的模型名用 cl100k_base；把文本编码成 token id，超过 8191 个 token 的切成几段；按 chunk_size 条、每批不超过 30 万 token 分批，请求体里发送的是 token id 列表；一条文本被切成几段时按 token 数加权平均再归一化。设为 False：按 chunk_size 条分批，请求体里直接发送原文。两条分支都返回 list[list[float]]。底部说明：非 OpenAI 模型的词表不同，用 OpenAI 兼容接口调用时应设 check_embedding_ctx_length=False。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:18px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .body{font-size:15px;fill:#17304b}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .yn{font-size:16px;font-weight:700;fill:#7a4300}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .start{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .step{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .alt{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .req{fill:#1f2a37;stroke:#1f2a37}
      .reqtext{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#e6edf5}
      .diamond{fill:#ffffff;stroke:#64748b;stroke-width:1.6}
      .done{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .note{fill:#fff9ef;stroke:#e0a43a;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1200" height="800" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">OpenAIEmbeddings.embed_documents：请求是怎么发出去的</text>
  <text x="36" y="82" class="sub">源码 langchain_openai/embeddings/base.py（1.6.4）· embed_query(text) 就是 embed_documents([text])[0]</text>

  <rect x="32" y="104" width="1136" height="574" rx="16" class="panel"/>

  <!-- 起点 -->
  <rect x="420" y="120" width="360" height="46" rx="23" class="start"/>
  <text x="600" y="150" class="code-b" text-anchor="middle">embed_documents(texts)</text>
  <path d="M 600 166 L 600 188" class="arrow"/>

  <!-- 判断 -->
  <polygon points="600,192 800,232 600,272 400,232" class="diamond"/>
  <text x="600" y="238" class="code" text-anchor="middle">check_embedding_ctx_length</text>

  <path d="M 400 232 L 330 232 L 330 290" class="arrow"/>
  <text x="352" y="222" class="yn" text-anchor="middle">True（默认）</text>
  <path d="M 800 232 L 900 232 L 900 290" class="arrow"/>
  <text x="868" y="222" class="yn" text-anchor="middle">False</text>

  <!-- 左：True -->
  <rect x="56" y="296" width="548" height="64" rx="12" class="step"/>
  <text x="76" y="323" class="label">① 选分词器</text>
  <text x="76" y="347" class="body">tiktoken.encoding_for_model(model)，不认识的模型名 → cl100k_base</text>
  <path d="M 330 360 L 330 376" class="arrow"/>

  <rect x="56" y="380" width="548" height="64" rx="12" class="step"/>
  <text x="76" y="407" class="label">② 文本 → token id</text>
  <text x="76" y="431" class="body">超过 embedding_ctx_length（8191）个 token 的，切成几段</text>
  <path d="M 330 444 L 330 460" class="arrow"/>

  <rect x="56" y="464" width="548" height="64" rx="12" class="step"/>
  <text x="76" y="491" class="label">③ 分批发请求</text>
  <text x="76" y="515" class="body">每批最多 chunk_size（1000）段，且不超过 30 万个 token</text>
  <path d="M 330 528 L 330 544" class="arrow"/>

  <rect x="56" y="548" width="548" height="44" rx="10" class="req"/>
  <text x="76" y="576" class="reqtext">"input": [[57668, 53901, 3922, 17599, …]]</text>
  <path d="M 330 592 L 330 608" class="arrow"/>

  <rect x="56" y="612" width="548" height="52" rx="12" class="step"/>
  <text x="76" y="644" class="body">④ 一条文本切成了几段：按 token 数加权平均，再归一化</text>

  <!-- 右：False -->
  <rect x="660" y="296" width="484" height="64" rx="12" class="alt"/>
  <text x="680" y="323" class="label">按 chunk_size（1000）条分批</text>
  <text x="680" y="347" class="body">不分词、不检查长度，原文直接发出</text>
  <path d="M 900 360 L 900 376" class="arrow"/>

  <rect x="660" y="380" width="484" height="44" rx="10" class="req"/>
  <text x="680" y="408" class="reqtext">"input": ["你好，很高兴认识你"]</text>
  <path d="M 900 424 L 900 440" class="arrow"/>

  <rect x="660" y="444" width="484" height="84" rx="12" class="alt"/>
  <text x="680" y="472" class="body">服务端用模型自己的分词器处理</text>
  <text x="680" y="498" class="body">超过模型最大输入的文本，由服务端截断或报错</text>
  <text x="680" y="518" class="small">（看各家接口的说明）</text>

  <!-- 汇合 -->
  <path d="M 604 638 L 760 638 L 760 620" class="arrow"/>
  <path d="M 900 528 L 900 572" class="arrow"/>
  <rect x="740" y="576" width="324" height="44" rx="22" class="done"/>
  <text x="902" y="604" class="code-b" text-anchor="middle">→ list[list[float]]</text>

  <!-- 底部说明 -->
  <rect x="32" y="694" width="1136" height="88" rx="12" class="note"/>
  <text x="56" y="722" class="body">token id 是 OpenAI 的 cl100k 词表里的编号，Qwen、jina、bge 等模型的词表不同，很多 OpenAI 兼容服务（vLLM、Ollama 等）不接受或会理解错。</text>
  <text x="56" y="747" class="body">用 OpenAIEmbeddings 调非 OpenAI 的模型时，按官方文档的建议设 check_embedding_ctx_length=False，直接发原文。</text>
  <text x="56" y="770" class="small">本笔记用的中转站两种写法结果相同（2.4.2 的验证），换一个服务就不一定了。</text>
</svg>
