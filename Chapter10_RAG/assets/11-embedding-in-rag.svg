<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">嵌入模型在 RAG 中的位置</title>
  <desc id="desc">写入路径：文本块列表交给 embed_documents，得到多个向量，连同原文和 metadata 存进向量库。查询路径：用户问题交给 embed_query，得到一个向量，在向量库里找相似度最高的向量，取最相似的 k 个文本块。两条路径用的是同一个嵌入模型，向量维度相同。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .lane{font-size:19px;font-weight:700}
      .label{font-size:18px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .body{font-size:15px;fill:#17304b}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .write{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .query{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
      .model{fill:#f1edff;stroke:#9d8be0;stroke-width:1.8;stroke-dasharray:7 5}
      .method{fill:#ffffff;stroke:#9d8be0;stroke-width:1.6}
      .store{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .note{fill:#fff9ef;stroke:#e0a43a;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">嵌入模型在 RAG 中的位置</text>
  <text x="36" y="82" class="sub">文档写入、用户查询之前，都要先用同一个嵌入模型把文本变成向量</text>

  <rect x="32" y="104" width="1136" height="436" rx="16" class="panel"/>

  <!-- 同一个嵌入模型 -->
  <rect x="300" y="122" width="262" height="400" rx="16" class="model"/>
  <text x="431" y="150" class="label" text-anchor="middle">同一个嵌入模型</text>
  <text x="431" y="174" class="small" text-anchor="middle">例：Qwen3-VL-Embedding-2B</text>
  <text x="431" y="510" class="small" text-anchor="middle">输出维度固定（这里是 1024）</text>

  <!-- 写入路径 -->
  <text x="56" y="150" class="lane" fill="#1f5fa8">① 写入（索引）</text>
  <text x="56" y="174" class="small">文档入库时，一次</text>
  <rect x="56" y="196" width="210" height="96" rx="12" class="write"/>
  <text x="161" y="228" class="label" text-anchor="middle">切好的文本块</text>
  <text x="161" y="254" class="code" text-anchor="middle">list[str]</text>
  <text x="161" y="277" class="small" text-anchor="middle">Document.page_content</text>

  <rect x="322" y="206" width="218" height="76" rx="12" class="method"/>
  <text x="431" y="238" class="code-b" text-anchor="middle">embed_documents</text>
  <text x="431" y="264" class="small" text-anchor="middle">一次传入多条</text>

  <rect x="604" y="196" width="230" height="96" rx="12" class="write"/>
  <text x="719" y="228" class="label" text-anchor="middle">每块一个向量</text>
  <text x="719" y="254" class="code" text-anchor="middle">list[list[float]]</text>
  <text x="719" y="277" class="small" text-anchor="middle">顺序和输入一致</text>

  <rect x="884" y="186" width="262" height="116" rx="12" class="store"/>
  <text x="1015" y="220" class="label" text-anchor="middle">向量库</text>
  <text x="1015" y="248" class="body" text-anchor="middle">向量 + 原文 + metadata</text>
  <text x="1015" y="274" class="small" text-anchor="middle">（2.5 节）</text>

  <path d="M 266 244 L 316 244" class="arrow"/>
  <path d="M 540 244 L 598 244" class="arrow"/>
  <path d="M 834 244 L 878 244" class="arrow"/>

  <!-- 查询路径 -->
  <text x="56" y="352" class="lane" fill="#9a5b00">② 查询（检索）</text>
  <text x="56" y="376" class="small">每次提问</text>
  <rect x="56" y="398" width="210" height="96" rx="12" class="query"/>
  <text x="161" y="430" class="label" text-anchor="middle">用户的问题</text>
  <text x="161" y="456" class="code" text-anchor="middle">str</text>
  <text x="161" y="479" class="small" text-anchor="middle">“猫咪平时吃什么？”</text>

  <rect x="322" y="408" width="218" height="76" rx="12" class="method"/>
  <text x="431" y="440" class="code-b" text-anchor="middle">embed_query</text>
  <text x="431" y="466" class="small" text-anchor="middle">一次传入一条</text>

  <rect x="604" y="398" width="230" height="96" rx="12" class="query"/>
  <text x="719" y="430" class="label" text-anchor="middle">问题的向量</text>
  <text x="719" y="456" class="code" text-anchor="middle">list[float]</text>
  <text x="719" y="479" class="small" text-anchor="middle">维度和文档向量相同</text>

  <rect x="884" y="388" width="262" height="116" rx="12" class="query"/>
  <text x="1015" y="420" class="label" text-anchor="middle">计算相似度</text>
  <text x="1015" y="448" class="body" text-anchor="middle">在库里找最接近的向量</text>
  <text x="1015" y="474" class="body" text-anchor="middle">取最相似的 k 个文本块</text>

  <path d="M 266 446 L 316 446" class="arrow"/>
  <path d="M 540 446 L 598 446" class="arrow"/>
  <path d="M 834 446 L 878 446" class="arrow"/>
  <path d="M 1015 302 L 1015 382" class="arrow"/>
  <text x="1027" y="348" class="small">文档向量</text>

  <!-- 底部说明 -->
  <rect x="32" y="556" width="1136" height="64" rx="12" class="note"/>
  <text x="56" y="584" class="body">相似度只在同一个向量空间里才有意义：换了嵌入模型（哪怕维度相同），库里的向量要全部重新计算。</text>
  <text x="56" y="607" class="small">常用的相似度是余弦相似度：两个向量夹角越小，值越接近 1，文本的意思越接近。</text>
</svg>
