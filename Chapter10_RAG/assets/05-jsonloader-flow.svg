<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="840" viewBox="0 0 1260 840" role="img" aria-labelledby="title desc">
  <title id="title">JSONLoader 的处理流程</title>
  <desc id="desc">第一步：按 UTF-8 读入 JSON 文件，json.loads 转成 Python 对象，再用 jq_schema 挑出若干结果，每个结果生成一个 Document，seq_num 依次编号。第二步：对每个结果，content_key 决定取哪部分作内容，text_content 决定非字符串内容是报错还是用 json.dumps 转成字符串，得到 page_content；默认 metadata 含 source 和 seq_num，设置 metadata_func 时用它的返回值作为 metadata。最后列出笔记中两种情况的结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .name{font-size:18px;font-weight:650}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#7a4300}
      .code-n{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .small{font-size:15px;fill:#52677e}
      .body{font-size:16px}
      .case{font-size:16px;font-weight:650;fill:#1d4f91}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-p{fill:none;stroke:#c98a1b;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .proc{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .param{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.8}
      .good{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .src{fill:#f3fbe4;stroke:#a9cc5a;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1260" height="840" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">JSONLoader 的处理流程：先用 jq 挑出结果，再为每个结果生成 Document</text>
  <text x="36" y="82" class="sub">橙色方框是参数起作用的位置 · 依据 langchain_community/document_loaders/json_loader.py</text>

  <!-- ① 读文件 + jq -->
  <rect x="32" y="108" width="1196" height="196" rx="16" class="panel"/>
  <text x="52" y="140" class="label">① 读文件，用 jq_schema 挑出结果</text>

  <rect x="52" y="160" width="250" height="110" rx="10" class="src"/>
  <text x="70" y="192" class="name">JSON 文件</text>
  <text x="70" y="222" class="small">按 UTF-8（可带 BOM）读取</text>
  <text x="70" y="246" class="small">json_lines=True：逐行读</text>
  <path d="M 308 215 H 346" class="arrow"/>

  <rect x="352" y="160" width="220" height="110" rx="10" class="proc"/>
  <text x="370" y="192" class="code-n">json.loads</text>
  <text x="370" y="222" class="small">JSON 文本</text>
  <text x="370" y="246" class="small">→ Python 对象</text>
  <path d="M 578 215 H 616" class="arrow"/>

  <rect x="622" y="160" width="260" height="110" rx="10" class="param"/>
  <text x="640" y="192" class="code-b">jq_schema</text>
  <text x="640" y="222" class="small">例：.messages[].content</text>
  <text x="640" y="246" class="small">可能产出 0 个、1 个或多个结果</text>
  <path d="M 888 215 H 926" class="arrow"/>

  <rect x="932" y="160" width="276" height="110" rx="10" class="proc"/>
  <text x="950" y="192" class="name">结果 1、结果 2 …</text>
  <text x="950" y="222" class="small">每个结果生成一个 Document</text>
  <text x="950" y="246" class="small">seq_num 依次为 1、2、3 …</text>

  <!-- ② 每个结果 -->
  <rect x="32" y="328" width="1196" height="330" rx="16" class="panel"/>
  <text x="52" y="360" class="label">② 对每个结果 record，分别生成 page_content 和 metadata</text>

  <rect x="52" y="384" width="200" height="90" rx="10" class="proc"/>
  <text x="70" y="414" class="name">record</text>
  <text x="70" y="440" class="small">jq 的一个结果</text>
  <text x="70" y="462" class="small">（str、dict、list…）</text>
  <path d="M 258 429 H 286" class="arrow"/>

  <rect x="292" y="384" width="320" height="90" rx="10" class="param"/>
  <text x="310" y="414" class="code-b">content_key</text>
  <text x="310" y="440" class="small">设置了：取 record[content_key]</text>
  <text x="310" y="462" class="small">没设置：用 record 本身</text>
  <path d="M 618 429 H 646" class="arrow"/>

  <rect x="652" y="384" width="330" height="90" rx="10" class="param"/>
  <text x="670" y="414" class="code-b">text_content</text>
  <text x="670" y="440" class="small">True：不是 str 就报 ValueError</text>
  <text x="670" y="462" class="small">False：dict / list → json.dumps</text>
  <path d="M 988 429 H 1016" class="arrow"/>

  <rect x="1022" y="384" width="186" height="90" rx="10" class="good"/>
  <text x="1040" y="420" class="code-n">page_content</text>
  <text x="1040" y="450" class="small">str</text>

  <path d="M 152 476 V 506 H 817 V 536" class="arrow-p"/>
  <text x="330" y="500" class="small">record 也会传给 metadata_func</text>

  <rect x="292" y="540" width="320" height="90" rx="10" class="proc"/>
  <text x="310" y="570" class="name">默认 metadata</text>
  <text x="310" y="596" class="small">{"source": 文件的绝对路径,</text>
  <text x="310" y="618" class="small"> "seq_num": 序号}</text>
  <path d="M 618 585 H 646" class="arrow"/>

  <rect x="652" y="540" width="330" height="90" rx="10" class="param"/>
  <text x="670" y="570" class="code-b" style="font-size:15px">metadata_func(record, metadata)</text>
  <text x="670" y="596" class="small">设置了：用它返回的 dict</text>
  <text x="670" y="618" class="small">没设置：直接用默认 metadata</text>
  <path d="M 988 585 H 1016" class="arrow"/>

  <rect x="1022" y="540" width="186" height="90" rx="10" class="good"/>
  <text x="1040" y="576" class="code-n">metadata</text>
  <text x="1040" y="606" class="small">dict</text>

  <!-- ③ 笔记中的两种情况 -->
  <rect x="32" y="682" width="1196" height="128" rx="16" class="panel"/>
  <text x="52" y="714" class="label">笔记中的两种情况</text>
  <text x="52" y="750" class="case">情况1</text>
  <text x="112" y="750" class="body">jq_schema="."：1 个结果，是整个对象（dict）→ 必须设 text_content=False，用 json.dumps 转成字符串 → 1 个 Document</text>
  <text x="52" y="784" class="case">情况2</text>
  <text x="112" y="784" class="body">jq_schema=".messages[].content"：4 个结果，都是 str → 默认 text_content=True 能通过 → 4 个 Document，seq_num 为 1–4</text>
</svg>
