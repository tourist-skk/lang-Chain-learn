<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">TextSplitter 的调用链：每个参数在哪一步生效</title>
  <desc id="desc">split_documents 取出每个 Document 的 page_content 和 metadata，调用 create_documents；create_documents 对每段文本调用 split_text，每个块生成一个 Document，add_start_index 在这里生效。split_text 是抽象方法，子类大多分两步：第一步按自己的规则切成小片，CharacterTextSplitter 等在这一步用 keep_separator；第二步 _merge_splits 把小片合并成块，chunk_size、chunk_overlap、length_function 在这里生效，其中 _join_docs 负责拼接并按 strip_whitespace 去掉首尾空白。类方法 from_tiktoken_encoder 和 from_huggingface_tokenizer 用 token 计数函数作为 length_function。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .small{font-size:15px;fill:#52677e}
      .code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#17304b}
      .code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#17304b}
      .ret{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#1d4f91}
      .pcode{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#7a4300}
      .core-text{font-size:15px;fill:#7a4300}
      .chip-text{font-size:14px;fill:#17304b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .link{fill:none;stroke:#e0a43a;stroke-width:1.6;stroke-dasharray:5 4}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .method{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .core{fill:#fff9ef;stroke:#e0a43a;stroke-width:2}
      .step{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .param{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
      .cls{fill:#f4f6f9;stroke:#c3ccd8;stroke-width:1.5;stroke-dasharray:7 4}
      .docbox{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .chip{fill:#ffffff;stroke:#9fb6d4;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="930" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">TextSplitter 的调用链：每个参数在哪一步生效</text>
  <text x="36" y="82" class="sub">源码位置 langchain_text_splitters/base.py（1.1.2）· 蓝色等宽字是返回值类型</text>

  <!-- 左：调用链 -->
  <rect x="32" y="104" width="716" height="806" rx="16" class="panel"/>
  <text x="52" y="136" class="label">调用链：从上往下调用，结果从下往上返回</text>

  <!-- A split_documents -->
  <rect x="56" y="152" width="668" height="96" rx="10" class="method"/>
  <text x="74" y="184" class="code-b">split_documents(documents)</text>
  <text x="706" y="184" class="ret" text-anchor="end">→ list[Document]</text>
  <text x="74" y="212" class="small">取出每个 Document 的 page_content 和 metadata，分别放进两个列表</text>
  <text x="74" y="236" class="small">transform_documents()、atransform_documents() 也是调用它</text>
  <path d="M 390 250 V 274" class="arrow"/>

  <!-- B create_documents -->
  <rect x="56" y="278" width="668" height="96" rx="10" class="method"/>
  <text x="74" y="310" class="code-b">create_documents(texts, metadatas=None)</text>
  <text x="706" y="310" class="ret" text-anchor="end">→ list[Document]</text>
  <text x="74" y="338" class="small">对每段文本调用 split_text()，每个块生成一个 Document</text>
  <text x="74" y="362" class="small">metadata：对应那段文本的 metadata 的深拷贝</text>
  <path d="M 390 376 V 400" class="arrow"/>

  <!-- C split_text -->
  <rect x="56" y="404" width="668" height="338" rx="12" class="core"/>
  <text x="74" y="436" class="code-b">split_text(text)</text>
  <text x="706" y="436" class="ret" text-anchor="end">→ list[str]</text>
  <text x="74" y="462" class="core-text">抽象方法，由子类实现。大多数子类都分两步：</text>

  <rect x="80" y="478" width="620" height="98" rx="10" class="step"/>
  <text x="96" y="507" class="label" style="font-size:17px">① 切成小片：每个子类自己实现</text>
  <text x="96" y="533" class="small">例如按 \n\n 切成三段；CharacterTextSplitter 用分隔符切（见 2.3.4.1）</text>
  <rect x="96" y="544" width="96" height="24" rx="5" class="chip"/><text x="144" y="561" class="chip-text" text-anchor="middle">段1</text>
  <rect x="202" y="544" width="130" height="24" rx="5" class="chip"/><text x="267" y="561" class="chip-text" text-anchor="middle">段2</text>
  <rect x="342" y="544" width="96" height="24" rx="5" class="chip"/><text x="390" y="561" class="chip-text" text-anchor="middle">段3</text>
  <path d="M 390 578 V 602" class="arrow"/>

  <rect x="80" y="606" width="620" height="120" rx="10" class="step"/>
  <text x="96" y="635" class="code">② _merge_splits(splits, separator)</text>
  <text x="96" y="661" class="small">依次把小片放进当前块；再放就超过 chunk_size 时，输出这一块，</text>
  <text x="96" y="683" class="small">然后保留末尾总长 ≤ chunk_overlap 的小片，作为下一块的开头</text>
  <text x="96" y="710" class="code" style="fill:#52677e">_join_docs()：用 separator 把小片拼成一块</text>
  <path d="M 390 744 V 768" class="arrow"/>

  <!-- D 结果 -->
  <rect x="56" y="772" width="668" height="118" rx="10" class="docbox"/>
  <text x="74" y="804" class="label" style="fill:#127a4b">最终返回 list[Document]：每个块一个 Document</text>
  <text x="74" y="834" class="code">Document(page_content=块,</text>
  <text x="155" y="858" class="code">metadata=原 metadata 的副本)</text>
  <text x="706" y="880" class="small" text-anchor="end">add_start_index=True 时 metadata 多一个 start_index · id 不继承，都是 None</text>

  <!-- 右：参数 -->
  <rect x="772" y="104" width="396" height="806" rx="16" class="panel"/>
  <text x="792" y="136" class="label">构造参数在这里生效</text>

  <rect x="792" y="152" width="356" height="110" rx="10" class="cls"/>
  <text x="808" y="180" class="small">另一种创建方式（类方法）：</text>
  <text x="808" y="204" class="code">from_tiktoken_encoder(...)</text>
  <text x="808" y="226" class="code">from_huggingface_tokenizer(...)</text>
  <text x="808" y="250" class="small">把“数 token”的函数设为 length_function</text>

  <!-- add_start_index -->
  <rect x="792" y="290" width="356" height="72" rx="10" class="param"/>
  <text x="808" y="318" class="pcode">add_start_index=False</text>
  <text x="808" y="345" class="small">True：metadata 里写入块的起始位置</text>
  <path d="M 724 326 H 790" class="link"/>

  <!-- keep_separator -->
  <rect x="792" y="482" width="356" height="90" rx="10" class="param"/>
  <text x="808" y="510" class="pcode">keep_separator=False</text>
  <text x="808" y="536" class="small">父类不使用；CharacterTextSplitter 等</text>
  <text x="808" y="558" class="small">切小片时决定分隔符的去留（2.3.4.1）</text>
  <path d="M 700 527 H 790" class="link"/>

  <!-- _merge_splits 的四个参数 -->
  <rect x="792" y="596" width="356" height="62" rx="10" class="param"/>
  <text x="808" y="622" class="pcode">chunk_size=4000</text>
  <text x="808" y="646" class="small">块的长度上限（尽量不超过）</text>
  <rect x="792" y="668" width="356" height="62" rx="10" class="param"/>
  <text x="808" y="694" class="pcode">chunk_overlap=200</text>
  <text x="808" y="718" class="small">相邻两块最多重叠多长</text>
  <rect x="792" y="740" width="356" height="62" rx="10" class="param"/>
  <text x="808" y="766" class="pcode">length_function=len</text>
  <text x="808" y="790" class="small">怎样计算长度：默认数字符</text>
  <rect x="792" y="812" width="356" height="62" rx="10" class="param"/>
  <text x="808" y="838" class="pcode">strip_whitespace=True</text>
  <text x="808" y="862" class="small">在 _join_docs 里去掉块首尾的空白</text>

  <path d="M 700 666 H 760" class="link"/>
  <path d="M 760 627 V 843" class="link"/>
  <path d="M 760 627 H 790" class="link"/>
  <path d="M 760 699 H 790" class="link"/>
  <path d="M 760 771 H 790" class="link"/>
  <path d="M 760 843 H 790" class="link"/>
</svg>
