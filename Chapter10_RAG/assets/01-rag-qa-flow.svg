<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940" role="img" aria-labelledby="title desc">
  <title id="title">RAG 的一次问答：检索、增强提示词、生成</title>
  <desc id="desc">A 部分：不用 RAG 时，模型只凭训练数据回答公司差旅报销问题，只能给通用说法甚至编造数字。B 部分：使用 RAG 时，先用问题到知识库中检索出第 4.2 和 4.5 条，再把片段和问题拼进提示词，最后由大模型依据资料生成带出处的回答。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a1b"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
      .title{font-size:30px;font-weight:700}
      .sub{font-size:17px;fill:#52677e}
      .label{font-size:19px;font-weight:650}
      .body{font-size:18px}
      .small{font-size:15px;fill:#52677e}
      .code{font-size:16px;fill:#17304b}
      .from-mem{font-size:16px;fill:#9a5b00}
      .mem-title{font-size:17px;fill:#9a5b00;font-weight:650}
      .chunk{font-size:15px;fill:#6b5a3a}
      .chunk-hit{font-size:15px;fill:#7a4300;font-weight:650}
      .q-text{font-size:16px;fill:#1d4f91}
      .bad-text{font-size:18px;fill:#b42318}
      .bad-small{font-size:15px;fill:#b42318}
      .good-text{font-size:18px;fill:#127a4b}
      .arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .arrow-mem{fill:none;stroke:#c98a1b;stroke-width:2.2;marker-end:url(#arrow-mem)}
      .panel{fill:#ffffff;stroke:#dce4ee}
      .req{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
      .step{fill:#e5f0ff;stroke:#7fa8de;stroke-width:1.8}
      .model{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
      .prompt{fill:#f4f6f9;stroke:#d5dde7;stroke-width:1.5}
      .inner{fill:#fbfcfe;stroke:#d5dde7;stroke-width:1.2}
      .bad{fill:#fdeeee;stroke:#f0b8b8;stroke-width:1.5}
      .good{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
      .mem{fill:#fff5e4;stroke:#e8c58a;stroke-width:1.5}
      .row{fill:#fffaf0;stroke:#f0dcb4;stroke-width:1}
      .row-hit{fill:#ffe7b8;stroke:#e0a43a;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1160" height="940" rx="20" fill="#f6f8fc"/>
  <text x="36" y="51" class="title">RAG 的一次问答：先检索，再增强提示词，最后生成</text>
  <text x="36" y="82" class="sub">同一个问题、同一个大模型 · 区别只在这次请求里发给模型的内容</text>

  <!-- A：不用 RAG -->
  <rect x="32" y="108" width="1096" height="204" rx="16" class="panel"/>
  <text x="52" y="140" class="label">A · 不用 RAG：模型只能凭训练时学到的知识回答</text>

  <rect x="52" y="160" width="250" height="92" rx="10" class="req"/>
  <text x="72" y="186" class="small">用户问题</text>
  <text x="72" y="212" class="body">出差去上海，住宿费</text>
  <text x="72" y="238" class="body">每晚能报多少？</text>
  <path d="M 314 206 H 360" class="arrow"/>

  <rect x="372" y="160" width="240" height="92" rx="10" class="model"/>
  <text x="492" y="200" class="label" text-anchor="middle">大模型</text>
  <text x="492" y="228" class="small" text-anchor="middle">只知道训练数据里的内容</text>
  <path d="M 624 206 H 672" class="arrow"/>

  <rect x="684" y="160" width="424" height="92" rx="10" class="bad"/>
  <text x="704" y="186" class="small">回答</text>
  <text x="704" y="212" class="bad-text">一线城市一般每晚 500–800 元，</text>
  <text x="704" y="238" class="bad-text">具体以公司规定为准。</text>

  <text x="52" y="290" class="bad-small">✗ 模型没见过公司的《差旅报销制度》，只能给通用说法，甚至编出一个数字（幻觉）</text>

  <!-- B：使用 RAG -->
  <rect x="32" y="332" width="1096" height="548" rx="16" class="panel"/>
  <text x="52" y="364" class="label">B · 使用 RAG：① 检索（R）→ ② 增强提示词（A）→ ③ 生成（G）</text>

  <rect x="52" y="400" width="250" height="92" rx="10" class="req"/>
  <text x="72" y="426" class="small">用户问题</text>
  <text x="72" y="452" class="body">出差去上海，住宿费</text>
  <text x="72" y="478" class="body">每晚能报多少？</text>
  <path d="M 314 446 H 360" class="arrow"/>

  <rect x="372" y="400" width="240" height="92" rx="10" class="step"/>
  <text x="492" y="432" class="label" text-anchor="middle">① 检索 Retrieval</text>
  <text x="492" y="458" class="small" text-anchor="middle">用问题去知识库里</text>
  <text x="492" y="480" class="small" text-anchor="middle">找最相关的片段</text>

  <path d="M 624 432 H 690" class="arrow"/>
  <text x="657" y="422" class="small" text-anchor="middle">查询</text>
  <path d="M 690 464 H 624" class="arrow-mem"/>
  <text x="657" y="486" class="from-mem" text-anchor="middle">命中 2 条</text>

  <rect x="702" y="384" width="406" height="176" rx="10" class="mem"/>
  <text x="722" y="410" class="mem-title">知识库：公司文档切成的片段</text>
  <rect x="722" y="424" width="366" height="28" rx="6" class="row"/>
  <text x="736" y="443" class="chunk">4.1  市内交通费按实际发生额报销</text>
  <rect x="722" y="456" width="366" height="28" rx="6" class="row-hit"/>
  <text x="736" y="475" class="chunk-hit">4.2  一线城市住宿每晚上限 600 元</text>
  <text x="1076" y="475" class="chunk-hit" text-anchor="end">命中</text>
  <rect x="722" y="488" width="366" height="28" rx="6" class="row-hit"/>
  <text x="736" y="507" class="chunk-hit">4.5  超出上限的部分由个人承担</text>
  <text x="1076" y="507" class="chunk-hit" text-anchor="end">命中</text>
  <rect x="722" y="520" width="366" height="28" rx="6" class="row"/>
  <text x="736" y="539" class="chunk">6.1  出差结束 30 天内提交报销</text>

  <path d="M 177 494 V 582" class="arrow"/>
  <text x="187" y="544" class="small">问题</text>
  <path d="M 492 494 V 582" class="arrow-mem"/>
  <text x="502" y="544" class="from-mem">命中的片段</text>

  <rect x="52" y="588" width="1056" height="150" rx="10" class="prompt"/>
  <text x="72" y="618" class="label">② 增强 Augmented：把命中的片段和问题拼进同一个提示词</text>
  <rect x="72" y="632" width="1016" height="92" rx="8" class="inner"/>
  <text x="92" y="658" class="code">请只根据下面的资料回答问题，并注明依据的条款。</text>
  <text x="92" y="684" class="from-mem">资料：[4.2] 一线城市住宿每晚上限 600 元；[4.5] 超出上限的部分由个人承担</text>
  <text x="92" y="710" class="q-text">问题：出差去上海，住宿费每晚能报多少？</text>

  <path d="M 177 740 V 770" class="arrow"/>
  <rect x="52" y="776" width="250" height="84" rx="10" class="model"/>
  <text x="177" y="810" class="label" text-anchor="middle">③ 生成 Generation</text>
  <text x="177" y="838" class="small" text-anchor="middle">大模型读提示词作答</text>
  <path d="M 314 818 H 372" class="arrow"/>

  <rect x="384" y="776" width="724" height="84" rx="10" class="good"/>
  <text x="404" y="804" class="small">回答</text>
  <text x="404" y="836" class="good-text">每晚最多报 600 元，超出部分由个人承担（依据：第 4.2、4.5 条）。</text>

  <text x="36" y="915" class="sub">两次请求用的是同一个模型。B 能答对，只是因为这次请求里多了检索到的两段资料。</text>
</svg>
