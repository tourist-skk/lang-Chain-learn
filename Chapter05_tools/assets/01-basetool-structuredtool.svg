<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc">
<title id="title">BaseTool 与 StructuredTool：继承关系和对象内容</title><desc id="desc">简化继承链由 StructuredTool 指向 BaseTool，再指向 Runnable。工具对象同时保存工具说明和同步或异步执行函数。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.ret{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:18px;fill:#1d4f91}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs>
<rect width="1160" height="640" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">BaseTool 与 StructuredTool：类的关系、对象中保存什么</text>
<text x="36" y="82" class="small" text-anchor="start">上方看继承关系，下方看一个具体工具对象的组成。</text>
<rect x="40" y="120" width="300" height="130" rx="14" class="blue"/>
<text x="60" y="158" class="code-b" text-anchor="start">Runnable</text>
<text x="60" y="190" class="body" text-anchor="start">统一调用接口</text>
<rect x="420" y="120" width="310" height="130" rx="14" class="purple"/>
<text x="440" y="158" class="code-b" text-anchor="start">BaseTool</text>
<text x="440" y="190" class="body" text-anchor="start">工具的抽象基类</text>
<rect x="810" y="120" width="310" height="130" rx="14" class="green"/>
<text x="830" y="158" class="code-b" text-anchor="start">StructuredTool</text>
<text x="830" y="190" class="body" text-anchor="start">带明确参数结构的工具</text>
<text x="60" y="224" class="code" text-anchor="start">invoke / ainvoke</text>
<text x="440" y="224" class="small" text-anchor="start">通用属性 + 调用流程</text>
<text x="830" y="224" class="small" text-anchor="start">args_schema + 执行实现</text>
<path d="M 416 183 H 344" class="arrow"/>
<path d="M 806 183 H 734" class="arrow"/>
<text x="380" y="164" class="small" text-anchor="middle">继承</text>
<text x="770" y="164" class="small" text-anchor="middle">继承</text>
<text x="40" y="282" class="small" text-anchor="start">图中省略中间的序列化类；BaseTool 的抽象业务方法需要由子类实现。</text>
<rect x="40" y="310" width="1080" height="294" rx="14" class="panel"/>
<text x="60" y="348" class="label" text-anchor="start">一个 StructuredTool 对象</text>
<rect x="60" y="370" width="450" height="142" rx="14" class="blue"/>
<text x="80" y="403" class="label" text-anchor="start">工具说明与附加信息</text>
<text x="80" y="440" class="code" text-anchor="start">name / description / args_schema</text>
<text x="80" y="479" class="body" text-anchor="start">metadata：来源、分类等辅助信息</text>
<rect x="550" y="370" width="550" height="142" rx="14" class="green"/>
<text x="570" y="403" class="label" text-anchor="start">实际执行的代码</text>
<text x="570" y="440" class="body" text-anchor="start">func：同步函数（可以为 None）</text>
<text x="570" y="479" class="body" text-anchor="start">coroutine：异步函数（可以为 None）</text>
<text x="60" y="546" class="code" text-anchor="start">常见创建入口：@tool 或 StructuredTool.from_function(...)</text>
<text x="60" y="581" class="small" text-anchor="start">invoke 需要 func；ainvoke 优先使用 coroutine，只有 func 时可在线程池执行。</text>
</svg>
