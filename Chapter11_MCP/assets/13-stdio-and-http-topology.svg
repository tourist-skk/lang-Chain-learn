<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
<title id="title">stdio 与 Streamable HTTP 的进程和连接</title><desc id="desc">同一计算服务通过 stdio 时由客户端启动子进程，使用管道连接；通过 HTTP 时服务先独立启动，客户端通过 URL 连接。两个传输方式保留相同工具名、Schema 和业务逻辑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="660" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">业务工具相同，连接方式与进程的管理者不同</text>
<text x="36" y="83" class="small" text-anchor="start">add / divide 的名称、Schema 与计算逻辑由同一份 calculator_server.py 提供。</text>
<rect x="40" y="130" width="520" height="385" rx="14" class="panel"/>
<rect x="600" y="130" width="520" height="385" rx="14" class="panel"/>
<text x="60" y="175" class="label" text-anchor="start">stdio：Client 启动服务子进程</text>
<text x="620" y="175" class="label" text-anchor="start">HTTP：先启动服务，再连接 URL</text>
<rect x="60" y="225" width="180" height="118" rx="14" class="green"/>
<rect x="340" y="225" width="200" height="118" rx="14" class="amber"/>
<rect x="620" y="225" width="180" height="118" rx="14" class="green"/>
<rect x="900" y="225" width="200" height="118" rx="14" class="amber"/>
<text x="80" y="267" class="label" text-anchor="start">MCP Client</text>
<text x="80" y="311" class="small" text-anchor="start">发现 / 调用工具</text>
<text x="640" y="267" class="label" text-anchor="start">MCP Client</text>
<text x="640" y="311" class="small" text-anchor="start">发现 / 调用工具</text>
<text x="360" y="267" class="label" text-anchor="start">服务子进程</text>
<text x="360" y="311" class="code" text-anchor="start">add / divide</text>
<text x="920" y="267" class="label" text-anchor="start">服务子进程</text>
<text x="920" y="311" class="code" text-anchor="start">add / divide</text>
<path d="M 244 264 H 336" class="arrow"/>
<path d="M 336 318 H 244" class="arrow"/>
<path d="M 804 264 H 896" class="arrow"/>
<path d="M 896 318 H 804" class="arrow"/>
<text x="290" y="247" class="code" text-anchor="middle">stdin</text>
<text x="290" y="303" class="code" text-anchor="middle">stdout</text>
<text x="850" y="247" class="code" text-anchor="middle">HTTP</text>
<text x="850" y="303" class="small" text-anchor="middle">响应</text>
<text x="60" y="391" class="body" text-anchor="start">连接目标：脚本 + Python 解释器</text>
<text x="60" y="430" class="small" text-anchor="start">不占用 HTTP 端口</text>
<text x="60" y="470" class="small" text-anchor="start">keep_alive=False：会话退出时停子进程</text>
<text x="620" y="391" class="body" text-anchor="start">连接目标：http://127.0.0.1:端口/mcp</text>
<text x="620" y="430" class="small" text-anchor="start">服务可以接受多个客户端连接</text>
<text x="620" y="470" class="small" text-anchor="start">Client 关闭：服务进程继续运行</text>
<rect x="40" y="550" width="1080" height="72" rx="14" class="purple"/>
<text x="60" y="595" class="body" text-anchor="start">两种 Transport 都交给 Client；两种 MCP 工具都可以经 MCPAdapter 交给 Agent。</text>
</svg>
