<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc">
<title id="title">runpy 与 PythonStdioTransport 执行脚本的区别</title><desc id="desc">runpy 在当前进程执行脚本顶层代码并返回全局对象字典，默认名称为 run_path，不进入 main 服务启动分支。PythonStdioTransport 构造连接配置，客户端连接时在新进程启动脚本，名称为 main，执行服务启动入口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="780" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">同一个服务脚本，两种执行方式和两类返回对象</text>
<text x="36" y="83" class="small" text-anchor="start">runpy 是 Python 文件执行工具；Transport 是 MCP 客户端的连接配置。</text>
<rect x="350" y="117" width="460" height="72" rx="14" class="panel"/>
<text x="580" y="160" class="label" text-anchor="middle">服务脚本：工具定义 + main 启动入口</text>
<path d="M 460 193 V 215 H 300 V 266" class="arrow"/>
<path d="M 700 193 V 215 H 860 V 266" class="arrow"/>
<rect x="159" y="224" width="282" height="29" fill="#f6f8fc"/>
<rect x="721" y="224" width="278" height="29" fill="#f6f8fc"/>
<text x="300" y="245" class="code" text-anchor="middle">runpy.run_path(...)</text>
<text x="860" y="245" class="small" text-anchor="middle">Client(Transport) 建立连接</text>
<rect x="40" y="270" width="520" height="385" rx="14" class="blue"/>
<rect x="600" y="270" width="520" height="135" rx="14" class="green"/>
<path d="M 860 409 V 445" class="arrow"/>
<rect x="600" y="450" width="520" height="205" rx="14" class="amber"/>
<text x="60" y="313" class="label" text-anchor="start">当前 notebook 进程</text>
<text x="620" y="313" class="label" text-anchor="start">notebook：创建客户端连接配置</text>
<text x="60" y="361" class="body" text-anchor="start">① 执行脚本顶层代码</text>
<text x="60" y="401" class="code" text-anchor="start">② __name__ = &quot;&lt;run_path&gt;&quot;</text>
<text x="60" y="441" class="small" text-anchor="start">③ main 条件不成立，不执行 mcp.run</text>
<text x="60" y="481" class="small" text-anchor="start">④ 返回 dict，其中包含 mcp 服务对象</text>
<text x="60" y="538" class="code" text-anchor="start">Client(objects[&quot;mcp&quot;])</text>
<text x="60" y="579" class="small" text-anchor="start">取得对象后，使用进程内连接调用</text>
<text x="60" y="622" class="label" text-anchor="start">实验：工具 PID = notebook PID</text>
<text x="620" y="355" class="body" text-anchor="start">Transport 构造返回配置对象</text>
<text x="620" y="386" class="small" text-anchor="start">进入 Client 上下文时启动新 Python</text>
<text x="620" y="487" class="label" text-anchor="start">子进程：作为主程序执行脚本</text>
<text x="620" y="529" class="code" text-anchor="start">__name__ = &quot;__main__&quot;</text>
<text x="620" y="565" class="small" text-anchor="start">main 条件成立，执行 mcp.run</text>
<text x="620" y="599" class="small" text-anchor="start">通过 stdin / stdout 收发 MCP 消息</text>
<text x="620" y="635" class="label" text-anchor="start">实验：工具 PID ≠ notebook PID</text>
<rect x="40" y="686" width="1080" height="61" rx="14" class="purple"/>
<text x="60" y="723" class="body" text-anchor="start">runpy 返回对象字典；Transport 返回连接配置；call_tool 等待后返回工具执行结果。</text>
</svg>
