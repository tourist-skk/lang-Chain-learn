<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">手工调用与 Agent 使用 MCP 工具的共同路径</title><desc id="desc">手工调用时应用直接填写工具名称和参数请求客户端。Agent 使用时模型产生 ToolCall，Agent 执行适配后的 StructuredTool，工具包装器通过客户端请求服务。两条路径均由服务执行函数，可使用进程内或跨进程连接。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="650" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">Agent 使用 MCP 工具时，Client 仍在调用链里</text>
<text x="36" y="83" class="small" text-anchor="start">区别在于谁选择工具、填写参数；计算仍由服务端完成。</text>
<text x="40" y="124" class="label" text-anchor="start">先验证：手工填写工具名与参数</text>
<rect x="40" y="145" width="590" height="130" rx="14" class="blue"/>
<text x="60" y="181" class="label" text-anchor="start">我们的测试代码</text>
<text x="60" y="220" class="code" text-anchor="start">name=&quot;add&quot;, arguments={&quot;a&quot;: 2, &quot;b&quot;: 3}</text>
<text x="60" y="253" class="small" text-anchor="start">直接调用 await client.call_tool(...)</text>
<rect x="710" y="145" width="170" height="130" rx="14" class="green"/>
<text x="730" y="181" class="label" text-anchor="start">MCP Client</text>
<text x="730" y="220" class="code" text-anchor="start">call_tool</text>
<text x="730" y="253" class="small" text-anchor="start">发请求 / 收结果</text>
<rect x="940" y="145" width="180" height="130" rx="14" class="amber"/>
<text x="960" y="181" class="label" text-anchor="start">MCP Server</text>
<text x="960" y="220" class="body" text-anchor="start">执行 add</text>
<text x="960" y="253" class="small" text-anchor="start">返回结果 5</text>
<path d="M 634 214 H 706" class="arrow"/>
<path d="M 884 214 H 936" class="arrow"/>
<text x="40" y="335" class="label" text-anchor="start">再接入 Agent：模型提出 ToolCall，Agent 执行工具</text>
<rect x="40" y="355" width="230" height="170" rx="14" class="blue"/>
<text x="60" y="394" class="label" text-anchor="start">聊天模型</text>
<text x="60" y="435" class="body" text-anchor="start">选择 add 与 a、b</text>
<text x="60" y="476" class="code" text-anchor="start">生成 ToolCall</text>
<rect x="340" y="355" width="290" height="170" rx="14" class="purple"/>
<text x="360" y="394" class="label" text-anchor="start">Agent 的工具执行环节</text>
<text x="360" y="435" class="code" text-anchor="start">StructuredTool.ainvoke</text>
<text x="360" y="476" class="small" text-anchor="start">MCPAdapter 提供包装工具</text>
<rect x="710" y="355" width="170" height="170" rx="14" class="green"/>
<text x="730" y="394" class="label" text-anchor="start">MCP Client</text>
<text x="730" y="435" class="code" text-anchor="start">call_tool</text>
<text x="730" y="476" class="small" text-anchor="start">发请求 / 收结果</text>
<rect x="940" y="355" width="180" height="170" rx="14" class="amber"/>
<text x="960" y="394" class="label" text-anchor="start">MCP Server</text>
<text x="960" y="435" class="body" text-anchor="start">执行 add</text>
<text x="960" y="476" class="small" text-anchor="start">返回结果 5</text>
<path d="M 274 442 H 336" class="arrow"/>
<path d="M 634 442 H 706" class="arrow"/>
<path d="M 884 442 H 936" class="arrow"/>
<text x="304" y="423" class="small" text-anchor="middle">请求</text>
<rect x="40" y="560" width="1080" height="62" rx="14" class="panel"/>
<text x="60" y="599" class="body" text-anchor="start">进程内或 stdio / HTTP 都可支持这两条路径；先用进程内连接专注验证工具本身。</text>
</svg>
