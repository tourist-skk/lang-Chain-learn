<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
<title id="title">HTTP 客户端关闭与服务进程停止的区别</title><desc id="desc">外层启动器管理 HTTP 服务子进程，内层两个客户端分别建立和关闭会话。关闭客户端 A 后服务仍在运行，客户端 B 可继续使用同一 URL。退出外层启动器时发送终止信号并等待进程退出。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="680" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">HTTP：关闭 Client 会话，服务进程仍然可以接受新连接</text>
<text x="36" y="83" class="small" text-anchor="start">外层由我们管理服务进程；内层 Client 管理自己的 MCP 连接。</text>
<rect x="40" y="130" width="1080" height="390" rx="14" class="amber"/>
<text x="60" y="177" class="label" text-anchor="start">外层 running_http_server：启动服务子进程，等待端口就绪</text>
<text x="60" y="215" class="small" text-anchor="start">HTTP 服务在这个范围内持续运行，PID 与 URL 保持不变。</text>
<rect x="70" y="255" width="460" height="168" rx="14" class="green"/>
<rect x="630" y="255" width="460" height="168" rx="14" class="green"/>
<text x="90" y="294" class="label" text-anchor="start">内层 Client A</text>
<text x="90" y="335" class="body" text-anchor="start">连接 → 发现工具 → 调用</text>
<text x="90" y="384" class="small" text-anchor="start">退出 A：关闭会话，服务仍在</text>
<text x="650" y="294" class="label" text-anchor="start">随后连接的 Client B</text>
<text x="650" y="335" class="body" text-anchor="start">同一 URL → 仍可发现和调用</text>
<text x="650" y="384" class="small" text-anchor="start">退出 B：关闭会话，服务仍在</text>
<path d="M 534 339 H 626" class="arrow"/>
<text x="580" y="320" class="small" text-anchor="middle">再连接</text>
<text x="70" y="471" class="body" text-anchor="start">MCPAdapter 也可以连接此 URL，为 Agent 提供相同工具。</text>
<path d="M 580 524 V 568" class="arrow"/>
<rect x="40" y="573" width="1080" height="72" rx="14" class="purple"/>
<text x="60" y="618" class="body" text-anchor="start">退出外层启动器：请求服务进程关闭并等待退出；清理日志和临时目录。</text>
</svg>
