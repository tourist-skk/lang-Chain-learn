<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">MCP 三类能力由谁决定使用，以及怎样进入模型</title><desc id="desc">同一个套餐服务提供 Tool get_plan、Resource plans://catalog 和 Prompt plan_answer。Tool 由 MCPAdapter 转成 StructuredTool，进入 Agent 的工具列表，由模型决定调用。Resource 和 Prompt 由 FastMCP Client 的 read_resource、get_prompt 获取，MCPAdapter 不转换它们，由应用代码决定是否放进消息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.head{font-size:19px;font-weight:650;fill:#52677e}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="650" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">三类能力都由客户端获取，只有 Tools 自动进入 Agent</text>
<text x="36" y="83" class="small" text-anchor="start">Resources 和 Prompts 被发现后，仍由应用代码决定是否放进模型的消息。</text>
<text x="40" y="135" class="head" text-anchor="start">MCP 服务 PlanService</text>
<text x="420" y="135" class="head" text-anchor="start">客户端获取</text>
<text x="800" y="135" class="head" text-anchor="start">怎样进入模型</text>
<rect x="40" y="155" width="330" height="120" rx="14" class="amber"/>
<text x="60" y="195" class="label" text-anchor="start">Tool：工具</text>
<text x="60" y="230" class="code" text-anchor="start">get_plan</text>
<text x="60" y="260" class="small" text-anchor="start">由模型决定何时调用</text>
<rect x="420" y="155" width="330" height="120" rx="14" class="green"/>
<text x="440" y="195" class="label" text-anchor="start">MCPAdapter</text>
<text x="440" y="230" class="code" text-anchor="start">adapter.list_tools()</text>
<text x="440" y="260" class="small" text-anchor="start">转成 StructuredTool</text>
<rect x="800" y="155" width="330" height="120" rx="14" class="purple"/>
<text x="820" y="195" class="label" text-anchor="start">Agent 的工具列表</text>
<text x="820" y="230" class="body" text-anchor="start">模型生成 ToolCall</text>
<text x="820" y="260" class="small" text-anchor="start">工具执行环节自动调用服务</text>
<path d="M 374 215 H 416" class="arrow"/>
<path d="M 754 215 H 796" class="arrow"/>
<rect x="40" y="300" width="330" height="120" rx="14" class="amber"/>
<text x="60" y="340" class="label" text-anchor="start">Resource：资料</text>
<text x="60" y="375" class="code" text-anchor="start">plans://catalog</text>
<text x="60" y="405" class="small" text-anchor="start">由应用决定是否使用</text>
<rect x="420" y="300" width="330" height="120" rx="14" class="green"/>
<text x="440" y="340" class="label" text-anchor="start">FastMCP Client</text>
<text x="440" y="375" class="code" text-anchor="start">client.read_resource(uri)</text>
<text x="440" y="405" class="small" text-anchor="start">返回资料内容；Adapter 不转换</text>
<rect x="800" y="300" width="330" height="120" rx="14" class="blue"/>
<text x="820" y="340" class="label" text-anchor="start">应用代码</text>
<text x="820" y="375" class="body" text-anchor="start">决定是否放进消息</text>
<text x="820" y="405" class="small" text-anchor="start">例如作为系统消息的一部分</text>
<path d="M 374 360 H 416" class="arrow"/>
<path d="M 754 360 H 796" class="arrow"/>
<rect x="40" y="445" width="330" height="120" rx="14" class="amber"/>
<text x="60" y="485" class="label" text-anchor="start">Prompt：提示词模板</text>
<text x="60" y="520" class="code" text-anchor="start">plan_answer</text>
<text x="60" y="550" class="small" text-anchor="start">由用户选择模板</text>
<rect x="420" y="445" width="330" height="120" rx="14" class="green"/>
<text x="440" y="485" class="label" text-anchor="start">FastMCP Client</text>
<text x="440" y="520" class="code" text-anchor="start">client.get_prompt(...)</text>
<text x="440" y="550" class="small" text-anchor="start">返回消息；Adapter 不转换</text>
<rect x="800" y="445" width="330" height="120" rx="14" class="blue"/>
<text x="820" y="485" class="label" text-anchor="start">应用代码</text>
<text x="820" y="520" class="body" text-anchor="start">用户选中模板后发送</text>
<text x="820" y="550" class="small" text-anchor="start">模板消息作为用户消息</text>
<path d="M 374 505 H 416" class="arrow"/>
<path d="M 754 505 H 796" class="arrow"/>
<text x="40" y="610" class="small" text-anchor="start">三类能力来自同一个服务，都经由 MCP Client 获取（MCPAdapter 内部也使用 Client）；区别在于谁决定使用，以及内容怎样进入模型。</text>
</svg>
