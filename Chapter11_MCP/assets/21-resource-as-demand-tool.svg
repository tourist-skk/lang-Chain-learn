<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="710" viewBox="0 0 1160 710" role="img" aria-labelledby="title desc">
<title id="title">把 Resource 封装成工具让模型按需读取</title><desc id="desc">应用向模型提供资源目录和本地 LangChain 工具定义。模型生成 ToolCall，Agent 执行本地异步包装工具，包装工具通过 Client read_resource 读取 MCP Resource，返回文本由 LangChain 包装为 ToolMessage，再交给模型生成回答。MCP 服务端仍注册 Resource，没有增加 MCP Tool。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="710" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">方式 B：目录让模型知道资料存在，读取工具让模型能够获取正文</text>
<text x="36" y="83" class="small" text-anchor="start">这是应用侧的 LangChain 包装工具；MCP 服务端仍把套餐对比表注册为 Resource。</text>
<rect x="40" y="115" width="230" height="100" rx="14" class="blue"/>
<text x="155" y="154" class="label" text-anchor="middle">模型</text>
<rect x="325" y="115" width="230" height="100" rx="14" class="purple"/>
<text x="440" y="154" class="label" text-anchor="middle">Agent + 本地工具</text>
<rect x="610" y="115" width="230" height="100" rx="14" class="green"/>
<text x="725" y="154" class="label" text-anchor="middle">FastMCP Client</text>
<rect x="895" y="115" width="230" height="100" rx="14" class="amber"/>
<text x="1010" y="154" class="label" text-anchor="middle">MCP Resource</text>
<text x="155" y="190" class="small" text-anchor="middle">目录、描述和 Schema</text>
<text x="440" y="190" class="small" text-anchor="middle">read_plan_catalog</text>
<text x="725" y="190" class="small" text-anchor="middle">read_resource(uri)</text>
<text x="1010" y="190" class="small" text-anchor="middle">plans://catalog</text>
<path d="M 155 219 V 640" fill="none" stroke="#b7c3d1" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 440 219 V 640" fill="none" stroke="#b7c3d1" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 725 219 V 640" fill="none" stroke="#b7c3d1" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 1010 219 V 640" fill="none" stroke="#b7c3d1" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 159 280 H 436" class="arrow"/>
<rect x="39" y="244" width="385" height="28" fill="#f6f8fc"/>
<text x="42" y="265" class="small" text-anchor="start">① AIMessage.tool_calls：真实工具请求</text>
<path d="M 444 350 H 721" class="arrow"/>
<rect x="447" y="314" width="275" height="28" fill="#f6f8fc"/>
<text x="450" y="335" class="small" text-anchor="start">② await read_resource(uri)</text>
<path d="M 729 420 H 1006" class="arrow"/>
<rect x="742" y="384" width="340" height="28" fill="#f6f8fc"/>
<text x="745" y="405" class="small" text-anchor="start">③ MCP 资源读取请求</text>
<path d="M 1006 490 H 729" class="arrow"/>
<rect x="742" y="454" width="380" height="28" fill="#f6f8fc"/>
<text x="745" y="475" class="small" text-anchor="start">④ 返回 TextResourceContents</text>
<path d="M 721 560 H 444" class="arrow"/>
<rect x="447" y="524" width="270" height="28" fill="#f6f8fc"/>
<text x="450" y="545" class="small" text-anchor="start">⑤ 包装工具返回资料字符串</text>
<path d="M 436 630 H 159" class="arrow"/>
<rect x="39" y="594" width="390" height="28" fill="#f6f8fc"/>
<text x="42" y="615" class="small" text-anchor="start">⑥ ToolMessage：正文 + 调用 ID</text>
<text x="40" y="683" class="body" text-anchor="start">模型收到 ToolMessage 后使用正文回答；日常问候可以直接回复，Resource 的读取次数保持为 0。</text>
</svg>
