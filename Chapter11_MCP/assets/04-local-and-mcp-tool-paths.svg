<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc">
<title id="title">一个函数成为本地工具和 MCP 工具的两条路径</title><desc id="desc">同一个加法函数经 LangChain tool 变成本地 StructuredTool，或注册到 FastMCP 后经客户端发现与适配变成客户端的 StructuredTool。两者都交给 create_agent。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
.life{fill:none;stroke:#b7c3d1;stroke-width:2;stroke-dasharray:6 5}
</style></defs><rect width="1160" height="550" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">同一个业务函数，两条工具包装路径</text>
<text x="36" y="82" class="small" text-anchor="start">最后都符合 BaseTool 接口；执行路径、参数表示和返回内容可以不同。</text>
<rect x="40" y="185" width="290" height="220" rx="14" class="amber"/>
<text x="60" y="227" class="label" text-anchor="start">同一份业务代码</text>
<text x="60" y="275" class="code-b" text-anchor="start">def add(a, b):</text>
<text x="60" y="313" class="code" text-anchor="start">    return a + b</text>
<text x="60" y="370" class="small" text-anchor="start">函数名、说明、类型注解</text>
<rect x="430" y="120" width="300" height="140" rx="14" class="blue"/>
<text x="450" y="156" class="label" text-anchor="start">本地 StructuredTool</text>
<text x="450" y="195" class="code" text-anchor="start">func = add</text>
<text x="450" y="231" class="small" text-anchor="start">args_schema：Pydantic 类</text>
<rect x="430" y="325" width="300" height="140" rx="14" class="amber"/>
<text x="450" y="361" class="label" text-anchor="start">FastMCP 服务注册 add</text>
<text x="450" y="400" class="body" text-anchor="start">公布工具描述与 Schema</text>
<text x="450" y="436" class="small" text-anchor="start">业务函数仍由服务端执行</text>
<rect x="830" y="325" width="290" height="140" rx="14" class="green"/>
<text x="850" y="361" class="label" text-anchor="start">适配后 StructuredTool</text>
<text x="850" y="400" class="code" text-anchor="start">coroutine：调用 Client</text>
<text x="850" y="436" class="small" text-anchor="start">args_schema：JSON 字典</text>
<rect x="830" y="120" width="290" height="140" rx="14" class="purple"/>
<text x="850" y="156" class="code-b" text-anchor="start">create_agent</text>
<text x="850" y="195" class="body" text-anchor="start">接收 LangChain tools</text>
<text x="850" y="231" class="small" text-anchor="start">模型提出调用，Agent 执行</text>
<path d="M 334 245 H 380 V 190 H 426" class="arrow"/>
<path d="M 334 345 H 380 V 395 H 426" class="arrow"/>
<path d="M 734 190 H 826" class="arrow"/>
<path d="M 734 395 H 826" class="arrow"/>
<path d="M 975 321 V 264" class="arrow"/>
<text x="380" y="171" class="code" text-anchor="middle">@tool</text>
<text x="780" y="377" class="small" text-anchor="middle">发现 → 适配</text>
<text x="40" y="516" class="small" text-anchor="start">适配创建的是客户端包装器；工具描述中不包含业务函数源代码。</text>
</svg>
