<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
<title id="title">MCP 配置字典接入两个服务，配置键成为工具名前缀</title><desc id="desc">配置字典的 mcpServers 中有 calc 和 plans 两个键。FastMCP 在客户端进程内创建名为 MCPRouter 的组合服务，挂载计算服务和套餐服务，并用配置键作为前缀，得到 calc_add、calc_divide 和 plans_get_plan。MCPAdapter 把它们转成 LangChain 工具，再与本地工具 multiply 一起交给 Agent。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.head{font-size:19px;font-weight:650;fill:#52677e}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="600" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">配置键成为工具名前缀</text>
<text x="36" y="83" class="small" text-anchor="start">MCPAdapter 通过一个组合连接发现两个服务的工具；本地工具直接加入同一个工具列表。</text>
<text x="40" y="135" class="head" text-anchor="start">MCP 配置字典</text>
<text x="420" y="135" class="head" text-anchor="start">组合服务（客户端进程内）</text>
<text x="800" y="135" class="head" text-anchor="start">交给 Agent 的工具</text>
<rect x="40" y="155" width="330" height="330" rx="14" class="blue"/>
<text x="60" y="195" class="code" text-anchor="start">{"mcpServers": {</text>
<text x="80" y="240" class="code" text-anchor="start">"calc": {</text>
<text x="100" y="270" class="code" text-anchor="start">"command": python,</text>
<text x="100" y="300" class="code" text-anchor="start">"args": [计算脚本]},</text>
<text x="80" y="345" class="code" text-anchor="start">"plans": {</text>
<text x="100" y="375" class="code" text-anchor="start">"command": python,</text>
<text x="100" y="405" class="code" text-anchor="start">"args": [套餐脚本]}</text>
<text x="60" y="450" class="code" text-anchor="start">}}</text>
<rect x="420" y="155" width="330" height="330" rx="14" class="green"/>
<text x="440" y="195" class="label" text-anchor="start">MCPRouter</text>
<text x="440" y="225" class="small" text-anchor="start">按配置键挂载每个服务</text>
<rect x="440" y="250" width="290" height="100" rx="12" class="amber"/>
<text x="460" y="283" class="body" text-anchor="start">calc → Calculator</text>
<text x="460" y="318" class="code" text-anchor="start">add、divide</text>
<rect x="440" y="365" width="290" height="100" rx="12" class="amber"/>
<text x="460" y="398" class="body" text-anchor="start">plans → PlanService</text>
<text x="460" y="433" class="code" text-anchor="start">get_plan</text>
<rect x="800" y="155" width="330" height="215" rx="14" class="purple"/>
<text x="820" y="195" class="label" text-anchor="start">MCPAdapter 适配后</text>
<text x="820" y="240" class="code" text-anchor="start">calc_add</text>
<text x="820" y="275" class="code" text-anchor="start">calc_divide</text>
<text x="820" y="310" class="code" text-anchor="start">plans_get_plan</text>
<text x="820" y="348" class="small" text-anchor="start">服务名统一显示为 MCPRouter</text>
<rect x="800" y="390" width="330" height="95" rx="14" class="blue"/>
<text x="820" y="428" class="label" text-anchor="start">本地 @tool</text>
<text x="820" y="463" class="code" text-anchor="start">multiply</text>
<path d="M 374 320 H 416" class="arrow"/>
<path d="M 754 300 H 796" class="arrow"/>
<text x="40" y="540" class="small" text-anchor="start">四个工具放进同一个 tools 列表交给 create_agent；工具名必须互不相同。</text>
</svg>
