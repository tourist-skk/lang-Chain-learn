<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
<title id="title">MCPAdapter 的对象与返回值生命周期</title><desc id="desc">同步构造适配器，异步进入连接，list_tools 发现并适配工具，退出释放连接。返回的列表按 BaseTool 声明，当前实际元素是 StructuredTool。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.ret{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:18px;fill:#1d4f91}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs>
<rect width="1160" height="590" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">MCPAdapter：先创建对象，再连接并发现工具</text>
<text x="36" y="82" class="small" text-anchor="start">蓝色返回类型对应实际代码中的对象；工具列表与工具执行结果是两次不同的返回。</text>
<rect x="40" y="125" width="245" height="150" rx="14" class="blue"/>
<rect x="315" y="125" width="245" height="150" rx="14" class="purple"/>
<rect x="590" y="125" width="245" height="150" rx="14" class="green"/>
<rect x="865" y="125" width="245" height="150" rx="14" class="amber"/>
<text x="56" y="162" class="code-b" text-anchor="start">MCPAdapter(target)</text>
<text x="56" y="203" class="body" text-anchor="start">同步构造</text>
<text x="56" y="244" class="small" text-anchor="start">→ MCPAdapter 对象</text>
<text x="331" y="162" class="code-b" text-anchor="start">async with adapter</text>
<text x="331" y="203" class="body" text-anchor="start">异步连接</text>
<text x="331" y="244" class="small" text-anchor="start">as 后仍是原适配器</text>
<text x="606" y="162" class="code-b" text-anchor="start">await list_tools()</text>
<text x="606" y="203" class="body" text-anchor="start">异步发现 + 适配</text>
<text x="606" y="244" class="small" text-anchor="start">→ list[BaseTool]</text>
<text x="881" y="162" class="code-b" text-anchor="start">退出 async with</text>
<text x="881" y="203" class="body" text-anchor="start">释放本次连接</text>
<text x="881" y="244" class="small" text-anchor="start">工具保留 Client 引用</text>
<path d="M 289 200 H 311" class="arrow"/>
<path d="M 564 200 H 586" class="arrow"/>
<path d="M 839 200 H 861" class="arrow"/>
<rect x="40" y="335" width="600" height="180" rx="14" class="panel"/>
<text x="60" y="372" class="label" text-anchor="start">返回值 tools：一个 Python 列表</text>
<rect x="60" y="396" width="180" height="93" rx="14" class="green"/>
<text x="76" y="428" class="code" text-anchor="start">tools[0]</text>
<text x="76" y="465" class="code" text-anchor="start">StructuredTool</text>
<rect x="250" y="396" width="180" height="93" rx="14" class="green"/>
<text x="266" y="428" class="code" text-anchor="start">tools[1]</text>
<text x="266" y="465" class="code" text-anchor="start">StructuredTool</text>
<rect x="440" y="396" width="180" height="93" rx="14" class="green"/>
<text x="456" y="428" class="code" text-anchor="start">tools[n]</text>
<text x="456" y="465" class="code" text-anchor="start">StructuredTool</text>
<rect x="700" y="335" width="420" height="180" rx="14" class="blue"/>
<text x="720" y="372" class="label" text-anchor="start">声明类型与实际类型</text>
<text x="720" y="413" class="ret" text-anchor="start">list[BaseTool]</text>
<text x="720" y="451" class="code" text-anchor="start">实际元素：StructuredTool</text>
<text x="720" y="489" class="small" text-anchor="start">它是 BaseTool 的子类</text>
<path d="M 712 279 V 306 H 340 V 331" class="arrow"/>
<path d="M 644 425 H 696" class="arrow"/>
<text x="40" y="554" class="small" text-anchor="start">list_tools 返回可调用的工具对象；真正搜索文档发生在后面的 ainvoke 中。</text>
</svg>
