<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
<title id="title">工具信息到模型以及 MCP 工具执行的时序</title><desc id="desc">Agent 先提供工具定义，模型返回 ToolCall，适配工具通过客户端请求 MCP 服务，结果转换并包装成带 tool_call_id 的 ToolMessage，再交给模型生成最终回答。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
.life{fill:none;stroke:#b7c3d1;stroke-width:2;stroke-dasharray:6 5}
</style></defs><rect width="1160" height="760" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">工具定义先到模型，工具执行结果随后回到模型</text>
<text x="36" y="82" class="small" text-anchor="start">ToolCall 的 id 用于 LangChain 消息对应；业务函数接收的是 args 中的 a、b。</text>
<rect x="40" y="115" width="195" height="66" rx="14" class="blue"/>
<text x="137.5" y="155" class="label" text-anchor="middle">聊天模型</text>
<rect x="335" y="115" width="195" height="66" rx="14" class="purple"/>
<text x="432.5" y="155" class="label" text-anchor="middle">Agent + 适配工具</text>
<rect x="630" y="115" width="195" height="66" rx="14" class="green"/>
<text x="727.5" y="155" class="label" text-anchor="middle">FastMCP Client</text>
<rect x="925" y="115" width="195" height="66" rx="14" class="amber"/>
<text x="1022.5" y="155" class="label" text-anchor="middle">MCP Server</text>
<path d="M 137.5 185 V 704" class="life"/>
<path d="M 432.5 185 V 704" class="life"/>
<path d="M 727.5 185 V 704" class="life"/>
<path d="M 1022.5 185 V 704" class="life"/>
<path d="M 429 235 H 141" class="arrow"/>
<rect x="42" y="200" width="370" height="27" fill="#f6f8fc"/>
<text x="45" y="220" class="small" text-anchor="start">① 名称、描述、参数 Schema</text>
<path d="M 141 300 H 429" class="arrow"/>
<rect x="42" y="265" width="370" height="27" fill="#f6f8fc"/>
<text x="45" y="285" class="small" text-anchor="start">② ToolCall：name / args / id</text>
<path d="M 436 365 H 724" class="arrow"/>
<rect x="442" y="330" width="275" height="27" fill="#f6f8fc"/>
<text x="445" y="350" class="small" text-anchor="start">③ coroutine 调用 Client</text>
<path d="M 731 430 H 1019" class="arrow"/>
<rect x="742" y="395" width="365" height="27" fill="#f6f8fc"/>
<text x="745" y="415" class="small" text-anchor="start">④ 发起 MCP 工具调用</text>
<path d="M 1019 495 H 731" class="arrow"/>
<rect x="737" y="460" width="370" height="27" fill="#f6f8fc"/>
<text x="740" y="480" class="small" text-anchor="start">⑤ 执行 add，返回协议结果</text>
<path d="M 724 560 H 436" class="arrow"/>
<rect x="442" y="525" width="275" height="27" fill="#f6f8fc"/>
<text x="445" y="545" class="small" text-anchor="start">⑥ 转换内容与结构化附件</text>
<path d="M 429 625 H 141" class="arrow"/>
<rect x="42" y="590" width="370" height="27" fill="#f6f8fc"/>
<text x="45" y="610" class="small" text-anchor="start">⑦ ToolMessage + tool_call_id</text>
<path d="M 141 690 H 429" class="arrow"/>
<rect x="42" y="655" width="370" height="27" fill="#f6f8fc"/>
<text x="45" y="675" class="small" text-anchor="start">⑧ 根据工具结果生成回答</text>
<text x="40" y="739" class="small" text-anchor="start">本地工具省去 Client / Server 调用，模型选择工具与 Agent 接收 ToolMessage 的基本循环相同。</text>
</svg>
