<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
<title id="title">把 Resource 和 Prompt 组成 Agent 消息</title><desc id="desc">应用通过 Client 读取 Resource 正文并构造 HumanMessage，通过 get_prompt 取得 MCP PromptMessage，再按原角色转换成 HumanMessage 或 AIMessage。将系统规则、资料消息和模板消息一起交给 Agent，模型才会接收到这些内容。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="660" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">方式 A：应用先获取正文和模板，再组装 Agent 的输入消息</text>
<text x="36" y="83" class="small" text-anchor="start">获取结果是 MCP 对象；应用明确决定内容、消息角色与顺序。</text>
<rect x="40" y="130" width="330" height="150" rx="14" class="green"/>
<text x="60" y="170" class="label" text-anchor="start">Client.read_resource</text>
<text x="60" y="208" class="code" text-anchor="start">plans://catalog</text>
<text x="60" y="245" class="small" text-anchor="start">返回套餐对比表的文本内容</text>
<rect x="420" y="130" width="330" height="150" rx="14" class="blue"/>
<text x="440" y="170" class="label" text-anchor="start">HumanMessage</text>
<text x="440" y="208" class="body" text-anchor="start">资料来源 URI + 表格正文</text>
<text x="440" y="245" class="small" text-anchor="start">以参考资料身份进入对话</text>
<rect x="40" y="335" width="330" height="165" rx="14" class="green"/>
<text x="60" y="375" class="label" text-anchor="start">Client.get_prompt</text>
<text x="60" y="413" class="code" text-anchor="start">plan_answer(question)</text>
<text x="60" y="451" class="code" text-anchor="start">GetPromptResult.messages</text>
<text x="60" y="481" class="small" text-anchor="start">模板参数已填好</text>
<rect x="420" y="335" width="330" height="165" rx="14" class="purple"/>
<text x="440" y="375" class="label" text-anchor="start">按原角色转换消息</text>
<text x="440" y="413" class="code" text-anchor="start">user → HumanMessage</text>
<text x="440" y="451" class="code" text-anchor="start">assistant → AIMessage</text>
<text x="440" y="481" class="small" text-anchor="start">本例只有一条文本 user 消息</text>
<rect x="830" y="185" width="290" height="350" rx="14" class="amber"/>
<text x="850" y="226" class="label" text-anchor="start">Agent 的 messages</text>
<text x="850" y="275" class="code" text-anchor="start">① SystemMessage</text>
<text x="850" y="310" class="small" text-anchor="start">    应用的回答规则</text>
<text x="850" y="356" class="code" text-anchor="start">② HumanMessage</text>
<text x="850" y="391" class="small" text-anchor="start">    套餐参考资料</text>
<text x="850" y="437" class="body" text-anchor="start">③ 转换后的 Prompt 消息</text>
<text x="850" y="483" class="small" text-anchor="start">模型依据这些消息回答</text>
<path d="M 374 205 H 416" class="arrow"/>
<path d="M 374 417 H 416" class="arrow"/>
<path d="M 754 205 H 790 V 345 H 826" class="arrow"/>
<path d="M 754 417 H 790 V 437 H 826" class="arrow"/>
<rect x="40" y="557" width="1080" height="70" rx="14" class="panel"/>
<text x="60" y="601" class="body" text-anchor="start">观察：读取 Resource、获取 Prompt 发生在模型请求前；模型直接回答，不需要生成读取 ToolCall。</text>
</svg>
