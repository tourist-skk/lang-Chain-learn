<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="625" viewBox="0 0 1160 625" role="img" aria-labelledby="title desc">
<title id="title">从进程内验证到独立服务脚本</title><desc id="desc">进程内客户端直接连接服务对象；独立运行时客户端通过当前 Python 解释器启动脚本，使用 stdio 通信。main 保护避免导入脚本时启动服务，客户端上下文管理进程关闭。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="625" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">工具实现和 Schema 相同，连接方式从对象变成脚本</text>
<text x="36" y="83" class="small" text-anchor="start">先验证业务与参数，再验证独立脚本；完整的 stdio / HTTP 用法留到第四节。</text>
<rect x="40" y="135" width="520" height="380" rx="14" class="panel"/>
<rect x="600" y="135" width="520" height="380" rx="14" class="panel"/>
<text x="60" y="179" class="label" text-anchor="start">第一步：同一 notebook 进程</text>
<text x="620" y="179" class="label" text-anchor="start">第二步：客户端 + 服务子进程</text>
<rect x="60" y="220" width="180" height="110" rx="14" class="green"/>
<rect x="320" y="220" width="220" height="110" rx="14" class="blue"/>
<rect x="620" y="220" width="180" height="110" rx="14" class="green"/>
<rect x="880" y="220" width="220" height="110" rx="14" class="amber"/>
<text x="80" y="261" class="label" text-anchor="start">Client</text>
<text x="80" y="301" class="small" text-anchor="start">连接服务对象</text>
<text x="340" y="261" class="label" text-anchor="start">FastMCP 对象</text>
<text x="340" y="301" class="code" text-anchor="start">add / divide</text>
<text x="640" y="261" class="label" text-anchor="start">Client</text>
<text x="640" y="301" class="small" text-anchor="start">启动脚本并连接</text>
<text x="900" y="261" class="label" text-anchor="start">服务子进程</text>
<text x="900" y="301" class="code" text-anchor="start">add / divide</text>
<path d="M 244 256 H 316" class="arrow"/>
<path d="M 316 301 H 244" class="arrow"/>
<path d="M 804 256 H 876" class="arrow"/>
<path d="M 876 301 H 804" class="arrow"/>
<text x="280" y="240" class="small" text-anchor="middle">进程内</text>
<text x="840" y="240" class="small" text-anchor="middle">stdio</text>
<text x="60" y="386" class="code" text-anchor="start">Client(calc_server)</text>
<text x="60" y="426" class="small" text-anchor="start">不需要端口，不启动额外进程</text>
<text x="60" y="467" class="small" text-anchor="start">导入脚本也能复用 mcp 对象验证</text>
<text x="620" y="386" class="code" text-anchor="start">PythonStdioTransport(script_path=...)</text>
<text x="620" y="426" class="code" text-anchor="start">脚本 main：mcp.run(transport=&quot;stdio&quot;)</text>
<text x="620" y="467" class="small" text-anchor="start">退出 async with Client：关闭连接和子进程</text>
<rect x="40" y="545" width="1080" height="52" rx="14" class="purple"/>
<text x="60" y="578" class="body" text-anchor="start">main 保护：读取脚本时只定义和注册工具；作为主程序执行时才启动服务。</text>
</svg>
