<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc">
<title id="title">Python 参数如何生成工具 Schema</title><desc id="desc">整数与浮点类型映射为 integer 与 number，默认值让 precision 成为可选参数，Annotated 与 Field 生成参数描述和范围约束。返回类型生成输出 Schema。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="640" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">函数签名是起点，Schema 是客户端看到的参数说明</text>
<text x="36" y="83" class="small" text-anchor="start">Field 描述和范围会进入 JSON Schema；函数体中的除数判断不会自动进入 Schema。</text>
<rect x="40" y="125" width="500" height="450" rx="14" class="blue"/>
<rect x="620" y="125" width="500" height="450" rx="14" class="green"/>
<text x="60" y="169" class="label" text-anchor="start">Python 中怎么写</text>
<text x="640" y="169" class="label" text-anchor="start">input_schema 中怎么看</text>
<text x="60" y="223" class="code" text-anchor="start">a: int / b: int</text>
<text x="640" y="223" class="code" text-anchor="start">&quot;type&quot;: &quot;integer&quot;</text>
<text x="60" y="267" class="code" text-anchor="start">numerator / denominator: float</text>
<text x="640" y="267" class="code" text-anchor="start">&quot;type&quot;: &quot;number&quot;</text>
<text x="60" y="321" class="code" text-anchor="start">precision: int = 2</text>
<text x="640" y="321" class="code" text-anchor="start">&quot;default&quot;: 2</text>
<text x="640" y="354" class="small" text-anchor="start">precision 不在 required 列表中</text>
<text x="60" y="409" class="code" text-anchor="start">Annotated[int, Field(...)]</text>
<text x="60" y="447" class="code" text-anchor="start">ge=0, le=6, description=&quot;...&quot;</text>
<text x="640" y="409" class="code" text-anchor="start">&quot;minimum&quot;: 0, &quot;maximum&quot;: 6</text>
<text x="640" y="447" class="code" text-anchor="start">&quot;description&quot;: &quot;保留的小数位数...&quot;</text>
<text x="60" y="513" class="body" text-anchor="start">无默认值的参数</text>
<text x="640" y="513" class="body" text-anchor="start">required：客户端必须提供</text>
<text x="60" y="551" class="small" text-anchor="start">precision 控制返回数值的精度</text>
<text x="640" y="551" class="small" text-anchor="start">缺省时使用 2；提供时检查范围</text>
<path d="M 544 218 H 616" class="arrow"/>
<path d="M 544 262 H 616" class="arrow"/>
<path d="M 544 316 H 616" class="arrow"/>
<path d="M 544 442 H 616" class="arrow"/>
<path d="M 544 508 H 616" class="arrow"/>
<text x="40" y="614" class="small" text-anchor="start">返回注解 → output_schema：本例用 result 字段包装整数或浮点结果。</text>
</svg>
