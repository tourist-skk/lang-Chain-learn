<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc">
<title id="title">MCP 工具 ainvoke 的两种输入与返回</title><desc id="desc">MCP 工具通过 coroutine 调用远程服务并转换结果。传入业务参数返回内容块列表，传入完整 ToolCall 返回 ToolMessage。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.ret{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:18px;fill:#1d4f91}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs>
<rect width="1160" height="540" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">MCP 工具的 ainvoke：同样遵循 ToolCall 包装规则</text>
<text x="36" y="82" class="small" text-anchor="start">类型仍是 StructuredTool；本节的业务内容来自远程文档服务。</text>
<rect x="40" y="125" width="300" height="112" rx="14" class="blue"/>
<text x="60" y="159" class="label" text-anchor="start">输入 ① 参数字典</text>
<text x="60" y="201" class="code" text-anchor="start">{&quot;query&quot;: &quot;...&quot;}</text>
<rect x="40" y="290" width="300" height="157" rx="14" class="green"/>
<text x="60" y="324" class="label" text-anchor="start">输入 ② 完整 ToolCall</text>
<text x="60" y="359" class="code" text-anchor="start">name / args / id / type</text>
<text x="60" y="391" class="code" text-anchor="start">args={&quot;query&quot;: &quot;...&quot;}</text>
<text x="60" y="423" class="code" text-anchor="start">id=&quot;manual_mcp_search&quot;</text>
<rect x="420" y="195" width="300" height="165" rx="14" class="purple"/>
<text x="440" y="234" class="code-b" text-anchor="start">await tool.ainvoke()</text>
<text x="440" y="274" class="body" text-anchor="start">coroutine 请求 MCP 服务</text>
<text x="440" y="311" class="body" text-anchor="start">转换返回的内容与附件</text>
<text x="440" y="343" class="small" text-anchor="start">func=None，使用异步实现</text>
<rect x="800" y="125" width="320" height="112" rx="14" class="blue"/>
<text x="820" y="159" class="label" text-anchor="start">返回内容块列表</text>
<text x="820" y="191" class="code" text-anchor="start">[{&quot;type&quot;:&quot;text&quot;,</text>
<text x="820" y="219" class="code" text-anchor="start">  &quot;text&quot;:&quot;...&quot;}, ...]</text>
<rect x="800" y="290" width="320" height="157" rx="14" class="green"/>
<text x="820" y="324" class="label" text-anchor="start">返回 ToolMessage</text>
<text x="820" y="358" class="code" text-anchor="start">content = 内容块列表</text>
<text x="820" y="391" class="code" text-anchor="start">tool_call_id =</text>
<text x="820" y="423" class="code" text-anchor="start">&quot;manual_mcp_search&quot;</text>
<path d="M 344 181 H 380 V 241 H 416" class="arrow"/>
<path d="M 344 368 H 380 V 314 H 416" class="arrow"/>
<path d="M 724 241 H 762 V 181 H 796" class="arrow"/>
<path d="M 724 314 H 762 V 368 H 796" class="arrow"/>
<text x="40" y="493" class="small" text-anchor="start">ToolMessage 还可以保留 artifact；内容和附件的通用规则见第五章 3.2.6。</text>
</svg>
