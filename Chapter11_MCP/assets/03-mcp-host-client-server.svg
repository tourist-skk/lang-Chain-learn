<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="570" viewBox="0 0 1160 570" role="img" aria-labelledby="title desc">
<title id="title">MCP 的 Host、Client、Server</title><desc id="desc">Host 应用组织聊天模型、LangChain Agent 与 MCP 客户端。客户端负责发现和调用，服务端保留函数实现。本节三个角色位于同一 Python 进程内。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
.life{fill:none;stroke:#b7c3d1;stroke-width:2;stroke-dasharray:6 5}
</style></defs><rect width="1160" height="570" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">Host、Client、Server：按职责分工，而不是按机器分工</text>
<text x="36" y="82" class="small" text-anchor="start">本节使用进程内连接；这些逻辑角色仍然成立，HTTP 和 stdio 在第四节展开。</text>
<rect x="40" y="120" width="690" height="390" rx="14" class="panel"/>
<text x="60" y="160" class="label" text-anchor="start">Host：我们的 Python / LangChain 应用</text>
<rect x="60" y="190" width="280" height="130" rx="14" class="blue"/>
<text x="80" y="226" class="label" text-anchor="start">聊天模型</text>
<text x="80" y="267" class="body" text-anchor="start">根据描述选择工具和参数</text>
<text x="80" y="301" class="small" text-anchor="start">读取工具结果后回答</text>
<rect x="420" y="190" width="290" height="130" rx="14" class="purple"/>
<text x="440" y="226" class="code-b" text-anchor="start">LangChain Agent</text>
<text x="440" y="267" class="body" text-anchor="start">组织模型与工具调用</text>
<text x="440" y="301" class="small" text-anchor="start">维护 messages 状态</text>
<path d="M 344 235 H 416" class="arrow"/>
<path d="M 416 291 H 344" class="arrow"/>
<text x="380" y="218" class="small" text-anchor="middle">调用</text>
<text x="380" y="281" class="small" text-anchor="middle">结果</text>
<rect x="420" y="375" width="290" height="105" rx="14" class="green"/>
<text x="440" y="411" class="code-b" text-anchor="start">Client：FastMCP</text>
<text x="440" y="449" class="small" text-anchor="start">发现工具 / 发起 MCP 调用</text>
<path d="M 565 324 V 371" class="arrow"/>
<text x="60" y="398" class="code-b" text-anchor="start">MCPAdapter</text>
<text x="60" y="435" class="small" text-anchor="start">为 Agent 创建可调用的工具</text>
<text x="60" y="468" class="small" text-anchor="start">工具内部使用这个 Client</text>
<rect x="820" y="120" width="300" height="390" rx="14" class="amber"/>
<text x="840" y="160" class="label" text-anchor="start">Server：Calculator</text>
<rect x="840" y="190" width="260" height="112" rx="14" class="panel"/>
<text x="860" y="227" class="label" text-anchor="start">工具描述</text>
<text x="860" y="256" class="code" text-anchor="start">name / description</text>
<text x="860" y="285" class="code" text-anchor="start">input_schema</text>
<rect x="840" y="350" width="260" height="130" rx="14" class="panel"/>
<text x="860" y="388" class="label" text-anchor="start">业务实现</text>
<text x="860" y="429" class="code-b" text-anchor="start">add(a, b)</text>
<text x="860" y="464" class="small" text-anchor="start">实际执行加法并返回结果</text>
<path d="M 714 405 H 816" class="arrow"/>
<path d="M 816 457 H 714" class="arrow"/>
<text x="765" y="388" class="small" text-anchor="middle">MCP 请求</text>
<text x="765" y="489" class="small" text-anchor="middle">协议结果</text>
<text x="40" y="548" class="small" text-anchor="start">发现请求返回工具信息；调用请求才让服务端执行业务函数。</text>
</svg>
