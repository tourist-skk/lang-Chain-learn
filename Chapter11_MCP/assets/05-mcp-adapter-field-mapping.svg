<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
<title id="title">MCP 工具描述到 StructuredTool 的字段映射</title><desc id="desc">as_langchain_tool 将 MCP 协议 Tool 的 name description input_schema 映射到 StructuredTool。工具元数据和客户端 server_info 合并为 metadata，客户端封装进 coroutine。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.code-b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:19px;font-weight:650}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
.life{fill:none;stroke:#b7c3d1;stroke-width:2;stroke-dasharray:6 5}
</style></defs><rect width="1160" height="660" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">适配过程：工具描述 + Client → StructuredTool</text>
<text x="36" y="82" class="small" text-anchor="start">MCPAdapter.list_tools 会批量完成这里的工作；本节也手动调用 as_langchain_tool。</text>
<rect x="40" y="125" width="450" height="240" rx="14" class="amber"/>
<text x="60" y="163" class="label" text-anchor="start">MCP 协议 Tool：描述数据</text>
<text x="60" y="205" class="code-b" text-anchor="start">name</text>
<text x="60" y="249" class="code-b" text-anchor="start">description</text>
<text x="60" y="293" class="code-b" text-anchor="start">input_schema</text>
<text x="60" y="337" class="code" text-anchor="start">annotations / _meta</text>
<rect x="40" y="405" width="450" height="180" rx="14" class="green"/>
<text x="60" y="444" class="label" text-anchor="start">Client 对象：额外的适配输入</text>
<text x="60" y="484" class="code" text-anchor="start">server_info：服务身份</text>
<text x="60" y="549" class="code" text-anchor="start">发起 call_tool 的客户端</text>
<rect x="670" y="125" width="450" height="460" rx="14" class="blue"/>
<text x="690" y="163" class="label" text-anchor="start">LangChain StructuredTool</text>
<text x="690" y="205" class="code-b" text-anchor="start">name</text>
<text x="690" y="249" class="code-b" text-anchor="start">description</text>
<text x="690" y="293" class="code-b" text-anchor="start">args_schema</text>
<text x="690" y="379" class="code-b" text-anchor="start">metadata[&quot;mcp&quot;]</text>
<text x="690" y="416" class="small" text-anchor="start">保存工具信息与服务身份</text>
<text x="690" y="504" class="code" text-anchor="start">coroutine = call_tool 包装函数</text>
<text x="690" y="549" class="code" text-anchor="start">func = None</text>
<path d="M 494 200 H 666" class="arrow"/>
<path d="M 494 244 H 666" class="arrow"/>
<path d="M 494 288 H 666" class="arrow"/>
<text x="580" y="272" class="small" text-anchor="middle">转换参数表示</text>
<path d="M 494 332 H 550 V 374 H 666" class="arrow"/>
<path d="M 494 479 H 550 V 374 H 666" class="arrow"/>
<text x="594" y="356" class="small" text-anchor="middle">合并元数据</text>
<path d="M 494 544 H 610 V 499 H 666" class="arrow"/>
<text x="40" y="627" class="small" text-anchor="start">coroutine 保存 Client 与工具名称；调用时才请求服务端，函数实现没有被复制到包装器里。</text>
</svg>
