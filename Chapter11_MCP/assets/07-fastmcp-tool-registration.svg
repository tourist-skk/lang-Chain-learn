<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
<title id="title">FastMCP 工具的注册与发现</title><desc id="desc">函数经服务对象的 tool 装饰器注册为服务端 FunctionTool，客户端发现的是 MCP Tool 描述。注册与发现均不执行业务函数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17304b}
.title{font-size:30px;font-weight:700} .label{font-size:21px;font-weight:650}
.body{font-size:18px} .small{font-size:17px;fill:#52677e}
.code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:17px}
.panel{fill:white;stroke:#dce4ee;stroke-width:1.5}
.blue{fill:#eef5ff;stroke:#bad2f1;stroke-width:1.5}
.green{fill:#e9f8f1;stroke:#9ad4b6;stroke-width:1.5}
.purple{fill:#f1edff;stroke:#c9bdf3;stroke-width:1.5}
.amber{fill:#fff5e4;stroke:#e0a43a;stroke-width:1.5}
.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style></defs><rect width="1160" height="600" rx="20" fill="#f6f8fc"/>
<text x="36" y="50" class="title" text-anchor="start">先注册能力，再让客户端发现工具</text>
<text x="36" y="83" class="small" text-anchor="start">@calc_server.tool 把函数登记到这个服务；没有调用 add 或 divide。</text>
<rect x="40" y="130" width="320" height="300" rx="14" class="blue"/>
<text x="60" y="172" class="label" text-anchor="start">① Python 业务函数</text>
<rect x="420" y="130" width="320" height="300" rx="14" class="amber"/>
<text x="440" y="172" class="label" text-anchor="start">② FastMCP 服务</text>
<rect x="800" y="130" width="320" height="300" rx="14" class="green"/>
<text x="820" y="172" class="label" text-anchor="start">③ Client 发现工具</text>
<text x="60" y="218" class="code" text-anchor="start">add(a: int, b: int)</text>
<text x="60" y="253" class="code" text-anchor="start">divide(..., precision=2)</text>
<text x="60" y="302" class="small" text-anchor="start">函数名 → 工具名称</text>
<text x="60" y="336" class="small" text-anchor="start">docstring → 工具描述</text>
<text x="60" y="370" class="small" text-anchor="start">参数注解 → 输入 Schema</text>
<text x="60" y="404" class="small" text-anchor="start">返回注解 → 输出 Schema</text>
<text x="440" y="218" class="code" text-anchor="start">FastMCP(&quot;Calculator&quot;)</text>
<text x="440" y="253" class="small" text-anchor="start">服务名与工具名各有用途</text>
<rect x="440" y="286" width="280" height="118" rx="14" class="panel"/>
<text x="460" y="322" class="label" text-anchor="start">注册表：FunctionTool</text>
<text x="460" y="360" class="code" text-anchor="start">add / divide</text>
<text x="460" y="391" class="small" text-anchor="start">保存函数实现与描述信息</text>
<text x="820" y="218" class="code" text-anchor="start">await client.list_tools()</text>
<text x="820" y="253" class="code" text-anchor="start">返回 list[mcp.types.Tool]</text>
<text x="820" y="302" class="code" text-anchor="start">name / description</text>
<text x="820" y="336" class="code" text-anchor="start">input_schema</text>
<text x="820" y="370" class="code" text-anchor="start">output_schema</text>
<text x="820" y="404" class="small" text-anchor="start">客户端获得协议描述数据</text>
<path d="M 364 266 H 416" class="arrow"/>
<path d="M 744 266 H 796" class="arrow"/>
<rect x="40" y="465" width="1080" height="96" rx="14" class="purple"/>
<text x="62" y="504" class="label" text-anchor="start">观察点：定义、注册、发现完成后，函数进入记录仍然为空。</text>
<text x="62" y="540" class="small" text-anchor="start">只有调用 client.call_tool(...)，才让服务执行对应函数并返回结果。</text>
</svg>
